---
docker_engine_enabled: false

# Docker CE from Docker's official apt repo (https://docs.docker.com/engine/install/ubuntu/).
docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Docker CE apt repo + signing key. Managed by tasks/repo.yml before install.
docker_engine_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_engine_apt_repo_channel: stable
# Maps ansible architecture to Debian multiarch name for the Docker apt repo.
docker_engine_deb_arch: >-
  {{ 'amd64' if ansible_facts['architecture'] | default('x86_64') == 'x86_64'
     else ansible_facts['architecture'] | default('amd64') }}

# Remove Ubuntu's distro Docker packages that conflict with Docker CE
# (containerd vs containerd.io). Data under /var/lib/docker is preserved.
docker_engine_remove_conflicting: true
docker_engine_conflicting_packages:
  - docker.io
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc

docker_engine_users: []

# Opt-in LVM-backed mounts for docker workload hosts (kif, kvm01). Empty list skips
# all storage tasks — lightweight docker hosts (dc01 DDNS) keep Docker on root FS.
docker_engine_volume_group: ""
docker_engine_data_volumes: []
docker_engine_data_volume_fstype: xfs
# fstab fields 4/5/6 (options, dump, passno) are passed separately to
# ansible.posix.mount — opts must NOT embed dump/passno or the module escapes the
# spaces (\040), producing an invalid options field that fails to mount at boot.
docker_engine_data_volume_opts: defaults
docker_engine_data_volume_dump: "0"
docker_engine_data_volume_passno: "2"

# NVIDIA Container Toolkit — auto detects PCI vendor 10de (NVIDIA).
docker_engine_nvidia_runtime: auto
docker_engine_nvidia_install_driver: false
docker_engine_nvidia_default_runtime: false

# Auto driver install uses `ubuntu-drivers install --gpgpu --recommended` only when
# no NVIDIA -server driver is present (it is not idempotent when multiple branches
# are recommended). Pin a specific metapackage for deterministic, idempotent installs,
# e.g. "nvidia-headless-no-dkms-580-server-open" or "nvidia-driver-580-server".
docker_engine_nvidia_driver_package: ""

# Installing the GPU driver can pull a newer HWE kernel; the toolkit and GPU
# workloads need the driver loaded against the running kernel. When a reboot is
# required, stop the play by default so the operator can reboot manually. Set true
# to let Ansible reboot the host and continue.
docker_engine_nvidia_auto_reboot: false

docker_engine_nvidia_repo_key_url: >-
  https://nvidia.github.io/libnvidia-container/gpgkey
# Maps ansible architecture to Debian multiarch name for the NVIDIA apt repo.
docker_engine_nvidia_deb_arch: >-
  {{ 'amd64' if ansible_facts['architecture'] | default('x86_64') == 'x86_64'
     else ansible_facts['architecture'] | default('amd64') }}
