---
- name: Docker engine NVIDIA | Detect PCI devices
  ansible.builtin.command:
    argv:
      - lspci
      - -nn
  register: docker_engine_lspci
  changed_when: false
  when: docker_engine_nvidia_runtime == 'auto'
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Set active flag from auto-detect
  ansible.builtin.set_fact:
    docker_engine_nvidia_active: "{{ '10de:' in docker_engine_lspci.stdout }}"
  when: docker_engine_nvidia_runtime == 'auto'
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Set active flag when forced on
  ansible.builtin.set_fact:
    docker_engine_nvidia_active: true
  when: docker_engine_nvidia_runtime is sameas true
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Install driver packages when requested
  ansible.builtin.apt:
    name:
      - ubuntu-drivers-common
    state: present
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
  tags: [docker_engine_nvidia]

# `ubuntu-drivers install --recommended` is NOT idempotent when more than one
# -server branch is "recommended": it flips to the other branch on each run,
# reinstalling packages and flagging a reboot every time. Only run it when no
# NVIDIA server driver is installed yet. Pin docker_engine_nvidia_driver_package
# for a specific, fully idempotent branch.
- name: Docker engine NVIDIA | Detect installed driver branch (pre-install)
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${Package}\n' 2>/dev/null \
      | grep -oE 'nvidia-(driver|headless(-no-dkms)?)-[0-9]+-server' \
      | grep -oE '[0-9]+' | sort -un | tail -n1
  args:
    executable: /bin/bash
  register: docker_engine_nvidia_installed_branch
  changed_when: false
  failed_when: false
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Install pinned GPU driver package
  ansible.builtin.apt:
    name: "{{ docker_engine_nvidia_driver_package }}"
    state: present
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
    - docker_engine_nvidia_driver_package | length > 0
  tags: [docker_engine_nvidia]

# Auto path: only on first install (no branch present) to avoid the flapping above.
# May install a newer kernel module; the reboot marker check below handles reboot.
- name: Docker engine NVIDIA | Install recommended GPU driver (auto)
  ansible.builtin.command:
    argv:
      - ubuntu-drivers
      - install
      - --gpgpu
      - --recommended
  register: docker_engine_nvidia_driver_install
  changed_when: >-
    'All the available drivers are already installed' not in
    docker_engine_nvidia_driver_install.stdout
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
    - docker_engine_nvidia_driver_package | length == 0
    - docker_engine_nvidia_installed_branch.stdout | default('') | trim | length == 0
  tags: [docker_engine_nvidia]

# `ubuntu-drivers --gpgpu` installs the headless -server driver but NOT
# nvidia-utils-<branch>-server, which provides nvidia-smi. Match the utils package
# to the branch that is actually installed now (idempotent once present).
- name: Docker engine NVIDIA | Detect installed driver branch (for utils)
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${Package}\n' 2>/dev/null \
      | grep -oE 'nvidia-(driver|headless(-no-dkms)?)-[0-9]+-server' \
      | grep -oE '[0-9]+' | sort -un | tail -n1
  args:
    executable: /bin/bash
  register: docker_engine_nvidia_branch
  changed_when: false
  failed_when: false
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Install nvidia-utils for nvidia-smi
  ansible.builtin.apt:
    name: "nvidia-utils-{{ docker_engine_nvidia_branch.stdout | trim }}-server"
    state: present
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
    - docker_engine_nvidia_branch.stdout | default('') | trim | length > 0
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Check for pending reboot marker
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: docker_engine_nvidia_reboot_marker
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Determine whether a reboot is required
  ansible.builtin.set_fact:
    docker_engine_nvidia_reboot_required: >-
      {{ (docker_engine_nvidia_reboot_marker.stat.exists | default(false))
         or ('not the expected kernel version'
             in (docker_engine_nvidia_driver_install.stdout | default('')))
         or ('consider rebooting'
             in (docker_engine_nvidia_driver_install.stdout | default(''))) }}
  when:
    - docker_engine_nvidia_active | default(false) | bool
    - docker_engine_nvidia_install_driver | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Reboot to load the new GPU driver kernel
  ansible.builtin.reboot:
    msg: Rebooting to load NVIDIA driver against the installed kernel
    reboot_timeout: 600
  when:
    - docker_engine_nvidia_reboot_required | default(false) | bool
    - docker_engine_nvidia_auto_reboot | bool
    - not ansible_check_mode
  tags: [docker_engine_nvidia]

# Gate the remaining GPU tasks (toolkit, daemon.json) until the driver kernel is
# running. Default is manual: fail with instructions so the operator reboots, then
# re-runs. Set docker_engine_nvidia_auto_reboot: true to reboot automatically above.
- name: Docker engine NVIDIA | Stop for manual reboot when required
  ansible.builtin.fail:
    msg: >-
      NVIDIA driver install requires a reboot before continuing (running kernel
      != installed kernel). Reboot {{ inventory_hostname }} and re-run this play.
      Set docker_engine_nvidia_auto_reboot: true to reboot automatically.
  when:
    - docker_engine_nvidia_reboot_required | default(false) | bool
    - not docker_engine_nvidia_auto_reboot | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Install repository key
  ansible.builtin.get_url:
    url: "{{ docker_engine_nvidia_repo_key_url }}"
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"
  when: docker_engine_nvidia_active | default(false) | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Configure apt repository
  ansible.builtin.template:
    src: nvidia-container-toolkit.list.j2
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    mode: "0644"
  when: docker_engine_nvidia_active | default(false) | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Install container toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
  when: docker_engine_nvidia_active | default(false) | bool
  tags: [docker_engine_nvidia]

- name: Docker engine NVIDIA | Mark toolkit as enabled for daemon.json
  ansible.builtin.set_fact:
    docker_engine_nvidia_toolkit_enabled: true
  when: docker_engine_nvidia_active | default(false) | bool
  tags: [docker_engine_nvidia]
