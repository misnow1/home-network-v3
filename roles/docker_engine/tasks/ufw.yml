# Docker engine | restrict published container ports to edge proxy hosts.
---
- name: Docker engine | Install UFW when managing edge firewall
  ansible.builtin.apt:
    name: ufw
    state: present
  tags: [docker_engine_ufw]

- name: Docker engine | Allow OpenSSH through UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
    comment: home-network-v3 docker host ssh
  tags: [docker_engine_ufw]

- name: Docker engine | Allow additional inbound rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src }}"
    comment: "{{ item.comment | default('home-network-v3 docker host') }}"
  loop: "{{ docker_engine_ufw_allow_rules }}"
  when: docker_engine_ufw_allow_rules | length > 0
  tags: [docker_engine_ufw]

- name: Docker engine | Allow published ports from edge proxy hosts
  community.general.ufw:
    rule: allow
    port: "{{ item.1 | string }}"
    proto: tcp
    src: "{{ item.0 }}"
    comment: home-network-v3 docker edge proxy
  loop: "{{ docker_engine_ufw_edge_proxy_cidrs | product(docker_engine_ufw_published_ports) | list }}"
  when:
    - docker_engine_ufw_edge_proxy_cidrs | length > 0
    - docker_engine_ufw_published_ports | length > 0
  tags: [docker_engine_ufw]

- name: Docker engine | Deny published ports from all other sources
  community.general.ufw:
    rule: deny
    port: "{{ item | string }}"
    proto: tcp
    comment: home-network-v3 docker published port deny
  loop: "{{ docker_engine_ufw_published_ports }}"
  when:
    - docker_engine_ufw_deny_unlisted_published_ports | bool
    - docker_engine_ufw_published_ports | length > 0
  tags: [docker_engine_ufw]

- name: Docker engine | Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny
  when: docker_engine_ufw_default_deny | bool
  tags: [docker_engine_ufw]

- name: Docker engine | Enable UFW
  community.general.ufw:
    state: enabled
  tags: [docker_engine_ufw]
