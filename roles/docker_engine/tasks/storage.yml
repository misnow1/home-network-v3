---
- name: Docker engine storage | Assert volume group is set
  ansible.builtin.assert:
    that:
      - docker_engine_volume_group | length > 0
    fail_msg: >-
      docker_engine_data_volumes is set but docker_engine_volume_group is empty.
      Set docker_engine_volume_group in host_vars for this workload host.
  tags: [docker_engine_storage]

- name: Docker engine storage | Assert each volume declares a size
  ansible.builtin.assert:
    that:
      - item.size is defined
      - item.size | string | length > 0
    fail_msg: >-
      docker_engine_data_volumes entry {{ item.lv | default('?') }} must declare size
      (used when the LV does not yet exist).
  loop: "{{ docker_engine_data_volumes }}"
  loop_control:
    label: "{{ item.lv | default('?') }}"
  tags: [docker_engine_storage]

- name: Docker engine storage | Install lvm2
  ansible.builtin.apt:
    name: lvm2
    state: present
  tags: [docker_engine_storage]

- name: Docker engine storage | Activate volume group
  ansible.builtin.command:
    argv:
      - vgchange
      - -ay
      - "{{ docker_engine_volume_group }}"
  register: docker_engine_vgchange
  changed_when: false
  tags: [docker_engine_storage]

- name: Docker engine storage | Ensure parent directory for docker volumes mount
  ansible.builtin.file:
    path: /var/lib/docker
    state: directory
    mode: "0711"
  when: >-
    docker_engine_data_volumes
    | map(attribute='mount')
    | select('equalto', '/var/lib/docker/volumes')
    | list
    | length > 0
  tags: [docker_engine_storage]

- name: Docker engine storage | Prepare each data volume
  ansible.builtin.include_tasks: storage_volume.yml
  loop: "{{ docker_engine_data_volumes }}"
  loop_control:
    loop_var: volume
    label: "{{ volume.lv }}"
  tags: [docker_engine_storage]

- name: Docker engine storage | Assert mounts are active before Docker starts
  ansible.builtin.command:
    argv:
      # --mountpoint (exact): --target would pass on an unmounted path by matching
      # an ancestor mount, giving false confidence the LV is mounted.
      - findmnt
      - --mountpoint
      - "{{ item.mount }}"
  loop: "{{ docker_engine_data_volumes }}"
  loop_control:
    label: "{{ item.mount }}"
  changed_when: false
  tags: [docker_engine_storage]
