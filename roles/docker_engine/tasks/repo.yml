---
- name: Docker engine repo | Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [docker_engine]

- name: Docker engine repo | Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker_engine]

- name: Docker engine repo | Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_engine_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  tags: [docker_engine]

- name: Docker engine repo | Remove legacy one-line docker.list source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  tags: [docker_engine]

- name: Docker engine repo | Deploy Docker apt source
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: docker_engine_apt_source
  tags: [docker_engine]

- name: Docker engine repo | Refresh apt cache after repo change
  ansible.builtin.apt:
    update_cache: true
  when: docker_engine_apt_source is changed
  tags: [docker_engine]
