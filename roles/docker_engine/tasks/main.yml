---
- name: Docker engine | Prepare dedicated storage
  ansible.builtin.include_tasks: storage.yml
  when:
    - docker_engine_enabled | bool
    - docker_engine_data_volumes | length > 0
  tags: [docker_engine, docker_engine_storage]

- name: Docker engine | Configure Docker apt repository
  ansible.builtin.include_tasks: repo.yml
  when: docker_engine_enabled | bool
  tags: [docker_engine]

- name: Docker engine | Install packages
  ansible.builtin.include_tasks: install.yml
  when: docker_engine_enabled | bool
  tags: [docker_engine]

- name: Docker engine | Configure NVIDIA container runtime
  ansible.builtin.include_tasks: nvidia.yml
  when:
    - docker_engine_enabled | bool
    - docker_engine_nvidia_runtime != 'false'
  tags: [docker_engine, docker_engine_nvidia]

- name: Docker engine | Configure daemon and service
  ansible.builtin.include_tasks: daemon.yml
  when: docker_engine_enabled | bool
  tags: [docker_engine]

- name: Docker engine | Restrict published ports to edge proxy (UFW)
  ansible.builtin.include_tasks: ufw.yml
  when:
    - docker_engine_enabled | bool
    - docker_engine_manage_ufw | bool
  tags: [docker_engine, docker_engine_ufw]
