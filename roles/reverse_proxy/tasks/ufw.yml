---
- name: Reverse proxy | Allow HTTP/HTTPS through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    comment: "home-network-v3 reverse proxy {{ item.name }}"
  loop:
    - name: http
      port: "80"
    - name: https
      port: "443"
  loop_control:
    label: "{{ item.name }}"
  tags: [reverse_proxy_ufw]
