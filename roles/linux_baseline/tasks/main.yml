---
- name: Apply baseline packages
  ansible.builtin.include_tasks: packages.yml
  tags: [packages]

- name: Install pyenv
  ansible.builtin.include_tasks: pyenv.yml
  when: linux_baseline_pyenv_enabled | bool
  tags: [packages]

- name: Install GitHub release binaries
  ansible.builtin.include_tasks: github_releases.yml
  tags: [packages]

- name: Apply shell drop-ins
  ansible.builtin.include_tasks: shell.yml
  tags: [shell]

- name: Apply hostname from inventory
  ansible.builtin.include_tasks: hostname.yml
  tags: [hostname]

- name: Apply system timezone
  ansible.builtin.include_tasks: timezone.yml
  tags: [timezone]

- name: Apply chrony time sync
  ansible.builtin.include_tasks: chrony.yml
  tags: [chrony]

- name: Relocate ansible user home off NFS /home
  ansible.builtin.include_tasks: ansible_user.yml
  when: linux_baseline_ansible_user_enabled | bool
  tags: [ansible_user]
