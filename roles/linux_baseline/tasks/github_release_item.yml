---
- name: GitHub release | Install release binary
  vars:
    release_tag: "{{ (item.tag_prefix | default('v')) ~ item.version }}"
    release_asset: "{{ item.asset | default(item.name ~ '-' ~ item.version ~ '-linux_amd64.tar.gz') }}"
    release_url: "https://github.com/{{ item.repo }}/releases/download/{{ release_tag }}/{{ release_asset }}"
    release_tmpdir: "/tmp/ansible-github-release-{{ item.name }}-{{ item.version }}"
    release_version_cmd: "{{ item.dest_dir | default(item.dest | dirname) }}/{{ (item.binaries | default([item.binary]))[0] }}"
    release_extract_dir: "{{ item.extract_subdir | default('') }}"
  block:
    - name: GitHub release | Check installed version
      ansible.builtin.command: "{{ release_version_cmd }} --version"
      register: github_release_installed
      changed_when: false
      failed_when: false

    - name: GitHub release | Report pending install (check mode)
      ansible.builtin.debug:
        msg: >-
          Would install {{ item.name }} {{ item.version }}
          from {{ release_url }} to {{ item.dest_dir | default(item.dest) }}
      when:
        - ansible_check_mode
        - github_release_installed.rc != 0 or item.version not in github_release_installed.stdout

    - name: GitHub release | Install pinned binary
      when:
        - not ansible_check_mode
        - github_release_installed.rc != 0 or item.version not in github_release_installed.stdout
      block:
        - name: GitHub release | Create temp dir
          ansible.builtin.file:
            path: "{{ release_tmpdir }}"
            state: directory
            mode: "0700"

        - name: GitHub release | Download archive
          ansible.builtin.get_url:
            url: "{{ release_url }}"
            dest: "{{ release_tmpdir }}/{{ release_asset }}"
            mode: "0644"

        - name: GitHub release | Extract archive
          ansible.builtin.unarchive:
            src: "{{ release_tmpdir }}/{{ release_asset }}"
            dest: "{{ release_tmpdir }}"
            remote_src: true

        - name: GitHub release | Install binaries
          ansible.builtin.copy:
            src: "{{ release_tmpdir ~ '/' ~ release_extract_dir ~ '/' ~ binary_name if release_extract_dir else release_tmpdir ~ '/' ~ binary_name }}"
            dest: "{{ item.dest_dir | default(item.dest | dirname) }}/{{ binary_name }}"
            mode: "{{ item.mode }}"
            remote_src: true
          loop: "{{ item.binaries | default([item.binary]) }}"
          loop_control:
            loop_var: binary_name

      always:
        - name: GitHub release | Remove temp dir
          ansible.builtin.file:
            path: "{{ release_tmpdir }}"
            state: absent
