---
- name: Pi-hole | Require web password when management enabled
  ansible.builtin.assert:
    that:
      - pihole_web_password | length > 0
    fail_msg: >-
      Set vault_pihole_web_password in inventories/production/group_vars/all/vault.yml
      (or disable with pihole_manage_web_password: false).
  when: pihole_manage_web_password | bool
  no_log: true

- name: Pi-hole | Check current web password via API
  ansible.builtin.uri:
    url: "{{ pihole_web_api_url }}"
    method: POST
    body_format: json
    body:
      password: "{{ pihole_web_password }}"
    status_code: [200, 401, 403]
  register: pihole_web_auth_check
  changed_when: false
  failed_when: false
  no_log: true
  when: pihole_manage_web_password | bool

- name: Pi-hole | Set web interface password
  ansible.builtin.command:
    cmd: "pihole setpassword {{ pihole_web_password | quote }}"
  register: pihole_setpassword_cmd
  changed_when: pihole_setpassword_cmd.rc == 0
  no_log: true
  when:
    - pihole_manage_web_password | bool
    - pihole_web_auth_check.status | default(401) != 200
