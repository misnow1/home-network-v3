---
# Pi-hole v6 role — config-only by default; opt-in install via pihole_install.

pihole_enabled: true

# Run official installer when Pi-hole is missing (Ubuntu repave workflow).
# Pre-seeds /etc/pihole/pihole.toml — do not use --unattended on v6; see
# docs/pihole-runbook.md and discourse.pi-hole.net/t/unattended-installation-for-v6-x/78295
pihole_install: false

# Web UI / API password — vault_pihole_web_password in group_vars/all/vault.yml.
pihole_manage_web_password: true
pihole_web_password: "{{ vault_pihole_web_password | default('') }}"
pihole_web_api_url: http://127.0.0.1/api/auth

# IPv6 client DNS — requires host GUA + UniFi DHCPv6 RDNSS (see pihole-runbook.md).
pihole_enable_ipv6: false

# FTL dns.* — see docs/pihole-runbook.md § DNS query handling.
# UI "Never forward non-FQDN queries" OFF → domainNeeded false.
# UI "Never forward reverse private" OFF → bogusPriv false (PTR → DC via server=/ zones).
pihole_dns_domain_needed: false
pihole_dns_bogus_priv: false

# LOCAL rejects cross-VLAN sources (IoT 192.168.3.x → Pi-hole on 192.168.1.x).
# SINGLE + interface accepts routed queries on the primary NIC only.
pihole_listening_mode: SINGLE
pihole_dns_interface: "{{ ansible_default_ipv4.interface | default('enp1s0') }}"

# BIND DLZ domain controllers (production defaults — override in group_vars/pihole).
pihole_dc_servers:
  - 192.168.1.10
  - 192.168.1.11

pihole_ad_domain: "{{ dc_domain_name | default('home.2123studios.com') }}"

# Reverse zones forwarded to DCs (match samba_dc_reverse_zones on DCs).
pihole_reverse_zones:
  - 1.168.192.in-addr.arpa

# Public upstream — align with dc_dns_forwarders; never point at Pi-hole from DCs.
# Prefer provider names (matches Settings → DNS checkboxes); raw IPs still supported.
pihole_upstream_providers: []
pihole_upstream_dns: []

# Static local names migrated from UniFi Local DNS Records (optional).
# Each item: { name: host.example.com, ip: 192.168.1.50 }
pihole_local_dns_records: []

pihole_ad_zones_conf: /etc/dnsmasq.d/05-ad-zones.conf
pihole_custom_list: /etc/pihole/custom.list

# Pi-hole v6 ignores /etc/dnsmasq.d unless enabled (see docs/pihole-runbook.md).
pihole_enable_etc_dnsmasq_d: true

# Clear Web UI conditional forwarding when using dnsmasq server=/ lines.
pihole_disable_rev_servers: true

# Run `pihole -g` only when tagged: --tags pihole_gravity
pihole_update_gravity: false
