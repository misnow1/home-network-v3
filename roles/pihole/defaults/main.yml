---
# Pi-hole v6 role — config-only by default; opt-in install via pihole_install.

pihole_enabled: true

# Run curl/basic-install when Pi-hole is missing (Ubuntu repave workflow).
pihole_install: false

# IPv6 client DNS — requires host GUA + UniFi DHCPv6 RDNSS (see pihole-runbook.md).
pihole_enable_ipv6: false
pihole_listening_mode: LOCAL

# BIND DLZ domain controllers (production defaults — override in group_vars/pihole).
pihole_dc_servers:
  - 192.168.1.10
  - 192.168.1.11

pihole_ad_domain: "{{ dc_domain_name | default('home.2123studios.com') }}"

# Reverse zones forwarded to DCs (match samba_dc_reverse_zones on DCs).
pihole_reverse_zones:
  - 1.168.192.in-addr.arpa

# Public upstream — align with dc_dns_forwarders; never point at Pi-hole from DCs.
pihole_upstream_dns: []  # configured in the UI

# Static local names migrated from UniFi Local DNS Records (optional).
# Each item: { name: host.example.com, ip: 192.168.1.50 }
pihole_local_dns_records: []

pihole_ad_zones_conf: /etc/dnsmasq.d/05-ad-zones.conf
pihole_custom_list: /etc/pihole/custom.list

# Pi-hole v6 ignores /etc/dnsmasq.d unless enabled (see docs/pihole-runbook.md).
pihole_enable_etc_dnsmasq_d: true

# Clear Web UI conditional forwarding when using dnsmasq server=/ lines.
pihole_disable_rev_servers: true

# Run `pihole -g` only when tagged: --tags pihole_gravity
pihole_update_gravity: false
