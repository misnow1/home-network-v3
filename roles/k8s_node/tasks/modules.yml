---
- name: Kubernetes node | Ensure modules-load.d directory exists
  ansible.builtin.file:
    path: /etc/modules-load.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s_node, k8s_modules]

- name: Kubernetes node | Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      {% for mod in k8s_kernel_modules %}
      {{ mod }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: Reload kernel modules
  tags: [k8s_node, k8s_modules]

# br_netfilter must be loaded before sysctl.yml — net.bridge.* keys do not exist until then.
- name: Kubernetes node | Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k8s_kernel_modules }}"
  when: not ansible_check_mode
  tags: [k8s_node, k8s_modules]
