---
- name: Kubernetes node | Install kubeadm preflight dependencies
  ansible.builtin.apt:
    name: "{{ k8s_preflight_packages }}"
    state: present
  tags: [k8s_node, k8s_packages]

- name: Kubernetes node | Install extra packages
  ansible.builtin.apt:
    name: "{{ k8s_extra_packages }}"
    state: present
  when: k8s_extra_packages | length > 0
  tags: [k8s_node, k8s_packages]

- name: Kubernetes node | Gather installed package versions
  ansible.builtin.package_facts:
    manager: apt
  tags: [k8s_node, k8s_packages]

# Without this, raising k8s_kubernetes_version is a silent no-op: the apt source
# moves to the new channel but the hold keeps the old minor installed.
- name: Kubernetes node | Detect pending Kubernetes minor version change
  ansible.builtin.set_fact:
    k8s_minor_change_pending: >-
      {{ installed | length > 0
         and not installed[0].version.startswith(k8s_kubernetes_version ~ '.') }}
  vars:
    installed: "{{ ansible_facts.packages['kubeadm'] | default([]) }}"
  tags: [k8s_node, k8s_packages]

- name: Kubernetes node | Release apt hold for pending minor version change
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ k8s_kubernetes_packages }}"
  when: k8s_minor_change_pending | bool
  tags: [k8s_node, k8s_packages]

- name: Kubernetes node | Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ k8s_kubernetes_packages }}"
    state: "{{ 'latest' if k8s_minor_change_pending | bool else 'present' }}"
  tags: [k8s_node, k8s_packages]

- name: Kubernetes node | Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_kubernetes_packages }}"
  when: k8s_kubernetes_package_hold | bool
  tags: [k8s_node, k8s_packages]

- name: Kubernetes node | Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true
  tags: [k8s_node, k8s_packages]
