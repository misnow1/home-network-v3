---
- name: Kubernetes node | Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Install containerd apt signing key
  ansible.builtin.get_url:
    url: "{{ k8s_containerd_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Deploy containerd apt source
  ansible.builtin.template:
    src: containerd.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: k8s_containerd_apt_source
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Refresh apt cache after containerd repo change
  ansible.builtin.apt:
    update_cache: true
  when: k8s_containerd_apt_source is changed
  tags: [k8s_node, k8s_containerd]
