---
- name: Kubernetes node | Remove conflicting distro container packages
  ansible.builtin.apt:
    name: "{{ k8s_conflicting_packages }}"
    state: absent
    purge: false
  when: k8s_remove_conflicting_packages | bool
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Install containerd packages
  ansible.builtin.apt:
    name: "{{ k8s_containerd_packages }}"
    state: present
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Deploy containerd config
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd
  tags: [k8s_node, k8s_containerd]

- name: Kubernetes node | Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  tags: [k8s_node, k8s_containerd]
