---
- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    daemon_reload: true

- name: Reload kernel modules
  ansible.builtin.systemd:
    name: systemd-modules-load
    state: restarted

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Reload systemd etcd snapshot units
  ansible.builtin.systemd:
    daemon_reload: true
