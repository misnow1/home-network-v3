---
k8s_node_enabled: false

# Kubernetes minor version — drives pkgs.k8s.io apt channel. Keep on a supported
# minor (upstream maintains the three most recent); see https://kubernetes.io/releases/
k8s_kubernetes_version: "1.36"

# pkgs.k8s.io apt repository (https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/)
k8s_kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_kubernetes_version }}/deb/Release.key"
k8s_kubernetes_apt_repo: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_kubernetes_version }}/deb/ /"

k8s_kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl

# kubeadm preflight FileExisting-* checks. conntrack is a fatal failure on a
# minimal Ubuntu server install; the rest are preflight warnings or needed by
# kube-proxy and `kubectl port-forward` at runtime.
k8s_preflight_packages:
  - conntrack
  - ebtables
  - ethtool
  - iproute2
  - iptables
  - socat

# Host-specific extras (e.g. etcd-client on the control plane).
k8s_extra_packages: []

# Daily etcd + kubeadm pki snapshot on the control plane. Off-box copy is a
# writable directory (NFS mount), never root SSH.
k8s_etcd_snapshot_enabled: false
k8s_etcd_snapshot_dir: /var/backups/etcd
k8s_etcd_snapshot_offbox_dir: ""
k8s_etcd_snapshot_retain_days: 7
k8s_etcd_snapshot_on_calendar: "*-*-* 03:15:00"
k8s_etcd_snapshot_randomized_delay_sec: 300
k8s_etcd_snapshot_script_path: /usr/local/sbin/k8s-etcd-snapshot
k8s_etcd_snapshot_unit: k8s-etcd-snapshot
k8s_etcd_snapshot_endpoints: https://127.0.0.1:2379
k8s_etcd_snapshot_cacert: /etc/kubernetes/pki/etcd/ca.crt
k8s_etcd_snapshot_cert: /etc/kubernetes/pki/etcd/server.crt
k8s_etcd_snapshot_key: /etc/kubernetes/pki/etcd/server.key

# Hold kubelet/kubeadm/kubectl at the installed version until deliberate upgrade.
k8s_kubernetes_package_hold: true

# containerd.io from Docker's apt repo (without docker-ce).
k8s_containerd_packages:
  - containerd.io

k8s_containerd_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
k8s_containerd_apt_repo_channel: stable
k8s_deb_arch: >-
  {{ 'amd64' if ansible_facts['architecture'] | default('x86_64') == 'x86_64'
     else ansible_facts['architecture'] | default('amd64') }}

k8s_remove_conflicting_packages: true
k8s_conflicting_packages:
  - docker.io
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc

k8s_sysctl_settings:
  net.ipv4.ip_forward: "1"
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"

k8s_kernel_modules:
  - overlay
  - br_netfilter

# Disable swap for kubelet (required by kubeadm).
k8s_disable_swap: true

# Operator break-glass SSH — local Unix account with pubkey auth (not AD).
k8s_operator_enabled: false
k8s_operator_user: ""
k8s_operator_uid: 1001
k8s_operator_gid: 1001
k8s_operator_shell: /bin/bash
k8s_operator_home: "/home/{{ k8s_operator_user }}"
k8s_operator_ssh_keys: []
k8s_operator_sudo: true

# CRI sandbox image. Must match `kubeadm config images list` for the target minor
# or kubeadm preflight warns and the runtime pulls a second pause image.
k8s_pause_image: registry.k8s.io/pause:3.10.2

# Set by packages.yml when the installed minor differs from k8s_kubernetes_version.
k8s_minor_change_pending: false

# Helm CLI — needed for the Cilium, MetalLB, and Envoy Gateway charts. Installed from
# the Helm project's own release archive; upstream explicitly does not vet the apt and
# snap packages. k8s_helm_sha256 is the linux-amd64 digest and must be bumped with
# k8s_helm_version (a mismatch fails the download rather than installing unverified).
k8s_helm_enabled: true
k8s_helm_version: "4.2.3"
k8s_helm_sha256: e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c
k8s_helm_install_dir: /usr/local/bin

# Cilium CLI — cluster install/status/Hubble helpers. Pin version + SHA256 together;
# see https://docs.cilium.io/en/stable/gettingstarted/k8s-install-default/#install-the-cilium-cli
k8s_cilium_cli_enabled: true
k8s_cilium_cli_version: "0.19.7"
k8s_cilium_cli_sha256: cd15e0983bf0acc7946cd05d453d1e58376ea92dec2642e745212df2b07d8852
k8s_cilium_cli_install_dir: /usr/local/bin

# System-wide kubectl tab completion (bash + zsh drop-ins under /etc).
k8s_kubectl_completion_enabled: true
