---
- name: NFS client | Ensure static mount point directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nfs_client_static_mounts }}"

- name: NFS client | Configure static NFS mounts (fstab + systemd automount)
  ansible.builtin.mount:
    path: "{{ item.path }}"
    src: "{{ nfs_client_server }}:{{ item.remote }}"
    fstype: nfs
    opts: >-
      rw,soft,timeo={{ nfs_client_soft_timeo }},retrans={{ nfs_client_soft_retrans }},
      nfsvers={{ nfs_client_nfsvers }},sec={{ nfs_client_sec }},
      _netdev,nofail,x-systemd.automount,x-systemd.mount-timeout=30s
    dump: "0"
    passno: "0"
    state: mounted
  loop: "{{ nfs_client_static_mounts }}"
  notify: reload systemd
