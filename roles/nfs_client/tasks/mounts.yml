---
- name: NFS client | Ensure static mount point directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ nfs_client_static_mounts }}"
  # Only manage the local mountpoint before NFS is mounted on it. Once mounted,
  # enforcing owner/group would chgrp the exported filesystem, which fails under
  # the server's root_squash (client root -> nobody).
  when: item.path not in (ansible_mounts | default([]) | map(attribute='mount') | list)

- name: NFS client | Configure static NFS mounts (fstab + systemd automount)
  ansible.builtin.mount:
    path: "{{ item.path }}"
    src: "{{ nfs_client_server }}:{{ item.remote }}"
    fstype: nfs
    opts: "{{ nfs_client_static_mount_opts | join(',') }}"
    dump: "0"
    passno: "0"
    state: mounted
  loop: "{{ nfs_client_static_mounts }}"
  notify: reload systemd
