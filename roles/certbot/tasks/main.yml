---
- name: Certbot | Require at least one domain when enabled
  ansible.builtin.assert:
    that:
      - certbot_domains | length > 0
      - certbot_domains[0] | length > 0
    fail_msg: Set certbot_domains when certbot_enabled is true.
  when: certbot_enabled | bool

- name: Certbot | Validate provider
  ansible.builtin.assert:
    that:
      - certbot_provider in ['local_ca', 'dreamhost_dns']
    fail_msg: "certbot_provider must be local_ca or dreamhost_dns (got {{ certbot_provider }})."
  when: certbot_enabled | bool

- name: Certbot | Require email for Let's Encrypt
  ansible.builtin.assert:
    that:
      - certbot_email | length > 0
    fail_msg: Set certbot_email when certbot_provider is dreamhost_dns.
  when:
    - certbot_enabled | bool
    - certbot_provider == 'dreamhost_dns'

- name: Certbot | Require Dreamhost API key for DNS validation
  ansible.builtin.assert:
    that:
      - certbot_dreamhost_api_key | length > 0
    fail_msg: Set vault_dreamhost_api_key in vault when certbot_provider is dreamhost_dns.
  when:
    - certbot_enabled | bool
    - certbot_provider == 'dreamhost_dns'
  no_log: true

- name: Certbot | Ensure renewal hook directory exists
  ansible.builtin.file:
    path: "{{ certbot_renewal_hooks_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: certbot_enabled | bool

- name: Certbot | Deploy renewal deploy hook
  ansible.builtin.template:
    src: reload-services.sh.j2
    dest: "{{ certbot_renewal_hooks_dir }}/reload-services.sh"
    owner: root
    group: root
    mode: "0755"
  when: certbot_enabled | bool

- name: Certbot | Issue certificate with local CA (lab)
  ansible.builtin.import_tasks: local_ca.yml
  when:
    - certbot_enabled | bool
    - certbot_provider == 'local_ca'

- name: Certbot | Issue certificate via Dreamhost DNS-01 (production)
  ansible.builtin.import_tasks: dreamhost_dns.yml
  when:
    - certbot_enabled | bool
    - certbot_provider == 'dreamhost_dns'
