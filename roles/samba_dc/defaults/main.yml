---
# Override in inventories/lab/group_vars/dc/vars.yml (non-secret).
# vault_samba_admin_password lives in inventories/lab/group_vars/all/vault.yml.

dc_domain_name: lab.test
dc_realm: LAB.TEST
dc_dns_forwarders:
  - 8.8.8.8
  - 8.8.4.4
dc_ntp_allow_cidr: 192.168.100.0/24
samba_dc_chrony_group: _chrony

# Networks permitted to query/recurse against BIND on the DC. Keep this scoped
# to trusted subnets so the DC is never an open recursive resolver. Defaults to
# the same trusted CIDR used for NTP signing.
samba_dc_dns_allowed_networks:
  - "{{ dc_ntp_allow_cidr }}"

samba_dc_dnsupdater_enabled: false
samba_dc_dnsupdater_name: dnsupdater
samba_dc_dnsupdater_groups:
  - DnsAdmins
samba_dc_dnsupdater_keytab_path: /var/lib/samba/private/dnsupdater.keytab

samba_dc_reverse_zones: []

samba_packages:
  - samba-ad-dc
  - krb5-user
  - bind9
  - bind9utils
  - ldap-utils
  - ldb-tools
  - ldb-tools
  - tcpdump
  - nmap

# AD migration — see docs/migration-runbook.md
# replica: dc-replica-join.yml (preferred, live pdc required)
# restore: dc-restore.yml (offline backup fallback)
samba_dc_migration_host: false
samba_dc_migration_mode: replica
samba_dc_restore_enabled: false
samba_dc_backup_archive: ""
samba_dc_backup_staged_path: /var/tmp/samba-backup-restore
samba_dc_target_server_name: dc1
# FQDN without trailing dot — required for BIND9_DLZ SOA MNAME (see dns_bind_dlz.yml).
samba_dc_dns_hostname: "{{ samba_dc_target_server_name | lower }}.{{ dc_domain_name }}"
# Add apex NS records before starting named (BIND9_DLZ requires NS per zone).
samba_dc_dns_ensure_zone_ns: true
samba_dc_restore_marker_path: /var/lib/samba/private/.ansible-restored-from-backup
samba_dc_replica_join_marker_path: /var/lib/samba/private/.ansible-replica-join
# Existing DC to replicate from (hostname or IP). Set in production group_vars/dc/vars.yml.
samba_dc_join_server: ""
# Resolvers used during join (must reach samba_dc_join_server). Usually the old DC IP.
samba_dc_join_nameservers: []
# AD site for the new DC (must exist on the source DC). Check with: samba-tool sites list
samba_dc_join_site: FerryCrossing
# Join credentials: vault_ad_join_user / vault_ad_join_password in group_vars/all/vault.yml
# Domain Admin rights required (e.g. Administrator). Optional overrides:
samba_dc_join_user: Administrator
samba_dc_join_password: "{{ vault_samba_admin_password }}"

# Upstream resolvers for apt/package installs before BIND is authoritative.
samba_dc_upstream_nameservers: "{{ dc_dns_forwarders }}"

# smb.conf search order — restore uses etc/smb.conf; provision may use /etc/samba/smb.conf.
samba_dc_smb_conf_candidates:
  - /var/lib/samba/etc/smb.conf
  - /var/lib/samba/private/smb.conf
  - /etc/samba/smb.conf
# Resolved at runtime by samba_smb_conf.yml.
samba_dc_smb_conf: /etc/samba/smb.conf

# LDAPS / START-TLS — apply with playbooks/certbot.yml (requires cert material first).
samba_dc_tls_enabled: false
samba_dc_tls_cert_dir: "{{ certbot_live_dir | default('/etc/letsencrypt/live/' ~ inventory_hostname) }}"

# Operator break-glass SSH (dc-converge) — local Unix account with pubkey auth.
samba_dc_operator_enabled: false
samba_dc_operator_user: ""
samba_dc_operator_uid: null
samba_dc_operator_gid: null
samba_dc_operator_shell: /bin/bash
samba_dc_operator_ssh_keys: []
samba_dc_operator_sudo: true
samba_dc_operator_home: "/home/{{ samba_dc_operator_user }}"
