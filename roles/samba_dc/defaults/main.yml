---
# Override in inventories/lab/group_vars/dc/vars.yml (non-secret).
# vault_samba_admin_password lives in inventories/lab/group_vars/all/vault.yml.

dc_domain_name: lab.test
dc_realm: LAB.TEST
dc_dns_forwarders:
  - 8.8.8.8
  - 8.8.4.4
dc_ntp_allow_cidr: 192.168.100.0/24
samba_dc_chrony_group: _chrony

# Estate-wide trusted IPv4 networks for BIND query/recursion ACLs. Override in
# group_vars/dc/vars.yml (production lists all VLANs + remote AD sites).
# MS-SNTP (chrony) uses dc_ntp_allow_cidr separately — often a subset of this list.
dc_trusted_networks:
  - "{{ dc_ntp_allow_cidr }}"

# Networks permitted to query/recurse against BIND on the DC. Keep this scoped
# to trusted subnets so the DC is never an open recursive resolver.
samba_dc_dns_allowed_networks: "{{ dc_trusted_networks }}"

# Include BIND localnets ACL (on-link GUA /64 when ISP prefix delegation changes).
samba_dc_dns_include_localnets: true

samba_dc_dnsupdater_enabled: false
samba_dc_dnsupdater_name: dnsupdater
samba_dc_dnsupdater_groups:
  - DnsAdmins
samba_dc_dnsupdater_keytab_path: /var/lib/samba/private/dnsupdater.keytab

samba_dc_reverse_zones: []

samba_packages:
  - samba-ad-dc
  - krb5-user
  - bind9
  - bind9utils
  - ldap-utils
  - ldb-tools
  - ldb-tools
  - tcpdump
  - nmap

# AD migration — see docs/dc-runbook.md (replica join / restore).
# replica: dc-replica-join.yml (preferred, live pdc required)
# restore: dc-restore.yml (offline backup fallback)
samba_dc_migration_host: false
samba_dc_migration_mode: replica
samba_dc_restore_enabled: false
samba_dc_backup_archive: ""
samba_dc_backup_staged_path: /var/tmp/samba-backup-restore
samba_dc_target_server_name: dc1
# FQDN without trailing dot — required for BIND9_DLZ SOA MNAME (see dns_bind_dlz.yml).
samba_dc_dns_hostname: "{{ samba_dc_target_server_name | lower }}.{{ dc_domain_name }}"
# Add apex NS records before starting named (BIND9_DLZ requires NS per zone).
samba_dc_dns_ensure_zone_ns: true
samba_dc_restore_marker_path: /var/lib/samba/private/.ansible-restored-from-backup
samba_dc_replica_join_marker_path: /var/lib/samba/private/.ansible-replica-join
# Existing DC to replicate from (hostname or IP). Set in production group_vars/dc/vars.yml.
samba_dc_join_server: ""
# Resolvers used during join (must reach samba_dc_join_server). Usually the old DC IP.
samba_dc_join_nameservers: []
# AD site for the new DC (must exist on the source DC). Check with: samba-tool sites list
samba_dc_join_site: FerryCrossing
# Join credentials: vault_ad_join_user / vault_ad_join_password in group_vars/all/vault.yml
# Domain Admin rights required (e.g. Administrator). Optional overrides:
samba_dc_join_user: Administrator
samba_dc_join_password: "{{ vault_samba_admin_password }}"

# Upstream resolvers for apt/package installs before BIND is authoritative.
samba_dc_upstream_nameservers: "{{ dc_dns_forwarders }}"

# smb.conf search order — restore uses etc/smb.conf; provision may use /etc/samba/smb.conf.
samba_dc_smb_conf_candidates:
  - /var/lib/samba/etc/smb.conf
  - /var/lib/samba/private/smb.conf
  - /etc/samba/smb.conf
# Resolved at runtime by samba_smb_conf.yml.
samba_dc_smb_conf: /etc/samba/smb.conf
# Converge owns smb.conf via templates/smb.conf.j2 after provision/join.
samba_dc_smb_conf_candidate_path: /var/tmp/samba-dc-smb.conf.ansible
samba_dc_smb_conf_backup_dir: /var/backups/samba
# Optional overrides (defaults derived from inventory_hostname / dc_domain_name).
# samba_dc_netbios_name: DC1
# samba_dc_workgroup: HOME
# samba_dc_log_level: "1"
# Extra SMB shares (e.g. dc1 images). Empty on most DCs.
samba_dc_shares: []

# Restrict Samba (and samba_dnsupdate) to primary LAN NIC + loopback so Docker
# bridge IPs and the LDAP VIP macvlan are not registered as DC A/AAAA records.
# See samba_interfaces.yml and docs/ldap-vip-runbook.md.
samba_dc_bind_interfaces_only: true
# When true, prune allows AAAA currently on the Samba NIC. When false (production
# default), prune deletes DC hostname AAAA — ISP GUAs are unstable; smb.conf still
# binds the NIC by *name* so Samba listens on whatever IPv6 is present at runtime.
samba_dc_register_ipv6: false
# Empty list = auto-detect lo + ansible_facts['default_ipv4']['interface'] (names).
# LDAP VIP lives on macvlan ldap0 — never list it here.
samba_dc_interfaces: []
samba_dc_dns_prune_script: /usr/local/sbin/samba-dc-prune-dns

# samba-ad-dc restart policy — the packaged unit ships Restart=no, so a Samba
# bind failure at boot (DHCPv6/SLAAC address still in Duplicate Address
# Detection) leaves the DC down until an operator notices. Retrying rides out
# DAD. See templates/samba-ad-dc-restart.conf.j2 and docs/dc-runbook.md.
samba_dc_restart_policy_manage: true
samba_dc_restart_sec: 15
# Burst/interval bound the retries so a genuinely broken config still fails the
# unit rather than looping forever. 10 tries over 10min far exceeds DAD (~1-3s).
samba_dc_restart_start_limit_interval_sec: 600
samba_dc_restart_start_limit_burst: 10

# LDAPS / START-TLS — apply with playbooks/certbot.yml (requires cert material first).
samba_dc_tls_enabled: false
samba_dc_tls_cert_dir: "{{ certbot_live_dir | default('/etc/letsencrypt/live/' ~ inventory_hostname) }}"

# Operator break-glass SSH (dc-converge) — local Unix account with pubkey auth.
samba_dc_operator_enabled: false
samba_dc_operator_user: ""
samba_dc_operator_uid: null
samba_dc_operator_gid: null
samba_dc_operator_shell: /bin/bash
samba_dc_operator_ssh_keys: []
samba_dc_operator_sudo: true
samba_dc_operator_home: "/home/{{ samba_dc_operator_user }}"

# Internal mail relay DNS (Slice 16+) — enable in production dc group_vars.
mail_relay_dns_enabled: false
mail_relay_hostname: mail.home.2123studios.com
mail_relay_dns_name: "{{ mail_relay_hostname.split('.')[0] }}"
mail_relay_target_ip: ""
mail_relay_mx_priority: 10
# Secondary relay A record (no MX — members use smtp_fallback_relay, not MX lookup).
mail_relay_secondary_enabled: false
mail_relay_secondary_hostname: mail2.home.2123studios.com
mail_relay_secondary_dns_name: "{{ mail_relay_secondary_hostname.split('.')[0] }}"
mail_relay_secondary_target_ip: ""

# LDAP/LDAPS VIP (keepalived on DC pair) — docs/ldap-vip-runbook.md
ldap_vip_enabled: false
ldap_vip_address: 192.168.1.12
ldap_vip_hostname: ldap.home.2123studios.com
ldap_vip_dns_name: "{{ ldap_vip_hostname.split('.')[0] }}"
