---
# Override in inventories/lab/group_vars/dc/vars.yml (non-secret).
# vault_samba_admin_password lives in inventories/lab/group_vars/all/vault.yml.

dc_domain_name: lab.test
dc_realm: LAB.TEST
dc_dns_forwarders:
  - 8.8.8.8
  - 8.8.4.4
dc_ntp_allow_cidr: 192.168.100.0/24
samba_dc_chrony_group: _chrony

# Networks permitted to query/recurse against BIND on the DC. Keep this scoped
# to trusted subnets so the DC is never an open recursive resolver. Defaults to
# the same trusted CIDR used for NTP signing.
samba_dc_dns_allowed_networks:
  - "{{ dc_ntp_allow_cidr }}"

samba_dc_dnsupdater_enabled: false
samba_dc_dnsupdater_name: dnsupdater
samba_dc_dnsupdater_groups:
  - DnsAdmins
samba_dc_dnsupdater_keytab_path: /var/lib/samba/private/dnsupdater.keytab

samba_dc_reverse_zones: []

samba_packages:
  - samba-ad-dc
  - krb5-user
  - bind9
  - bind9utils
  - ldap-utils

# Migration restore (playbooks/dc-restore.yml) — see docs/migration-runbook.md
samba_dc_migration_host: false
samba_dc_restore_enabled: false
samba_dc_backup_archive: ""
samba_dc_backup_staged_path: /var/lib/samba/backup-restore
samba_dc_target_server_name: dc1
samba_dc_restore_marker_path: /var/lib/samba/private/.ansible-restored-from-backup
