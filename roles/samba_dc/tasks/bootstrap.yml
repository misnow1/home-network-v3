---
# One-shot Samba AD DC provision. Imported only by playbooks/dc-bootstrap.yml.
# smb.conf is generated by samba-tool — never template it here.

- name: DC bootstrap | Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [samba_packages]

- name: DC bootstrap | Install Samba AD DC packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
  tags: [samba_packages]

- name: DC bootstrap | Mask conflicting Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - smbd
    - nmbd
    - winbind
  failed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Mask systemd-resolved (DC uses BIND on port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Check if domain already provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb
  changed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Remove pre-existing smb.conf before first provision
  ansible.builtin.file:
    path: /etc/samba/smb.conf
    state: absent
  when: not samba_sam_ldb.stat.exists
  tags: [samba_provision]

- name: DC bootstrap | Provision Samba AD domain (BIND9_DLZ, RFC2307)
  # samba-tool domain provision only accepts the new admin password via
  # --adminpass (no env/stdin equivalent). This runs once on a fresh host and
  # no_log keeps it out of Ansible output; the argv exposure window is the
  # initial provision only.
  ansible.builtin.command:
    cmd: >-
      samba-tool domain provision
      --realm={{ dc_realm | upper }}
      --domain={{ dc_domain_name.split('.')[0] | upper }}
      --server-role=dc
      --dns-backend=BIND9_DLZ
      --adminpass={{ vault_samba_admin_password }}
      --use-rfc2307
    creates: /var/lib/samba/private/sam.ldb
  no_log: true
  tags: [samba_provision]

- name: DC bootstrap | Configure resolver to use local BIND
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # DC uses local BIND for {{ dc_domain_name }} AD DNS
      nameserver 127.0.0.1
      search {{ dc_domain_name }}
    owner: root
    group: root
    mode: "0644"
  tags: [samba_dns]

- name: DC bootstrap | Deploy named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: restart named
  tags: [samba_dns]

- name: DC bootstrap | Wire Samba DLZ include into named.conf.local
  ansible.builtin.blockinfile:
    path: /etc/bind/named.conf.local
    block: |
      include "/var/lib/samba/bind-dns/named.conf";
    marker: "# {mark} ANSIBLE MANAGED BLOCK: samba-dlz"
    create: true
  notify: restart named
  tags: [samba_dns]

- name: DC bootstrap | Deploy AppArmor local rules for BIND9_DLZ
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/local/usr.sbin.named
    block: |
      /var/lib/samba/bind-dns/** rwk,
      /var/lib/samba/bind-dns/dns.keytab rk,
      /var/lib/samba/private/krb5.conf r,
      /usr/lib/**/samba/bind9/** rmk,
      /usr/lib/**/samba/gensec/* rmk,
      /usr/lib/**/samba/ldb/** rmk,
      /usr/lib/**/ldb/modules/ldb/** rmk,
      /var/tmp/** rwmk,
    marker: "# {mark} ANSIBLE MANAGED BLOCK: samba-dlz"
    create: true
  notify: reload apparmor
  tags: [samba_dns]

- name: DC bootstrap | Enable and start named
  ansible.builtin.service:
    name: named
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [samba_dns]

- name: DC bootstrap | Unmask and enable samba-ad-dc
  ansible.builtin.systemd:
    name: samba-ad-dc
    masked: false
    enabled: true
  tags: [samba_provision]

- name: DC bootstrap | Start samba-ad-dc
  ansible.builtin.service:
    name: samba-ad-dc
    state: started
  when: not ansible_check_mode
  tags: [samba_provision]

- name: DC bootstrap | Copy generated krb5.conf to /etc/krb5.conf
  ansible.builtin.copy:
    src: /var/lib/samba/private/krb5.conf
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  tags: [samba_kerberos]
