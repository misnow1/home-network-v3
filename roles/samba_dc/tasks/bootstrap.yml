---
# One-shot Samba AD DC provision. Imported only by playbooks/dc-bootstrap.yml.
# smb.conf is generated by samba-tool — never template it here.

- name: DC bootstrap | Refuse provision on migration-restore hosts
  ansible.builtin.stat:
    path: "{{ samba_dc_restore_marker_path }}"
  register: samba_dc_restore_marker
  changed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Assert greenfield bootstrap is intended
  ansible.builtin.assert:
    that:
      - not (samba_dc_migration_host | default(false) | bool)
      - not samba_dc_restore_marker.stat.exists
      - samba_dc_backup_archive | default('') | length == 0
    fail_msg: >-
      This host is configured for AD migration restore (samba_dc_migration_host,
      restore marker, or samba_dc_backup_archive). Use playbooks/dc-restore.yml
      instead of dc-bootstrap.yml. See docs/migration-runbook.md.
  tags: [samba_provision]

- name: DC bootstrap | Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [samba_packages]

- name: DC bootstrap | Install Samba AD DC packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
  tags: [samba_packages]

- name: DC bootstrap | Mask conflicting Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - smbd
    - nmbd
    - winbind
  failed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Mask systemd-resolved (DC uses BIND on port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Check if domain already provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb
  changed_when: false
  tags: [samba_provision]

- name: DC bootstrap | Remove pre-existing smb.conf before first provision
  ansible.builtin.file:
    path: /etc/samba/smb.conf
    state: absent
  when: not samba_sam_ldb.stat.exists
  tags: [samba_provision]

- name: DC bootstrap | Provision Samba AD domain (BIND9_DLZ, RFC2307)
  # samba-tool domain provision only accepts the new admin password via
  # --adminpass (no env/stdin equivalent). This runs once on a fresh host and
  # no_log keeps it out of Ansible output; the argv exposure window is the
  # initial provision only.
  ansible.builtin.command:
    cmd: >-
      samba-tool domain provision
      --realm={{ dc_realm | upper }}
      --domain={{ dc_domain_name.split('.')[0] | upper }}
      --server-role=dc
      --dns-backend=BIND9_DLZ
      --adminpass={{ vault_samba_admin_password }}
      --use-rfc2307
    creates: /var/lib/samba/private/sam.ldb
  no_log: true
  tags: [samba_provision]

- name: DC bootstrap | Configure BIND DLZ and start directory services
  ansible.builtin.import_tasks: dns_bind_dlz.yml
