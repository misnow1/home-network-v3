---
# Ensure internal mail relay A + MX records in AD DNS (Slice 16+).
# Uses --machine-pass on the local DC (same pattern as dns_ensure_zone_ns.yml).

- name: Samba DC mail relay DNS | Check if domain is provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb
  changed_when: false
  tags: [samba_dns, samba_converge]

- name: Samba DC mail relay DNS | Require target IP when enabled
  ansible.builtin.assert:
    that:
      - mail_relay_target_ip | length > 0
    fail_msg: >-
      Set mail_relay_target_ip (kif IP) when mail_relay_dns_enabled is true.
  when: mail_relay_dns_enabled | bool
  tags: [samba_dns, samba_converge]

- name: Samba DC mail relay DNS | Ensure A and MX records
  ansible.builtin.shell: |
    set -euo pipefail
    zone="{{ dc_domain_name }}"
    host="{{ mail_relay_dns_name }}"
    fqdn="{{ mail_relay_hostname }}."
    ip="{{ mail_relay_target_ip }}"
    mx_prio="{{ mail_relay_mx_priority }}"
    changed=0

    if ! samba-tool dns query localhost "$zone" "$host" A --machine-pass 2>/dev/null \
      | grep -qE "^[[:space:]]+A:[[:space:]]+${ip//./\\.}[[:space:]]*$"; then
      if samba-tool dns query localhost "$zone" "$host" A --machine-pass 2>/dev/null \
        | grep -qE '^[[:space:]]+A:'; then
        old_ip=$(samba-tool dns query localhost "$zone" "$host" A --machine-pass \
          | awk '/^[[:space:]]+A:/ {print $2; exit}')
        samba-tool dns delete localhost "$zone" "$host" A "$old_ip" --machine-pass
      fi
      samba-tool dns add localhost "$zone" "$host" A "$ip" --machine-pass
      echo "added-a: $host -> $ip"
      changed=1
    else
      echo "ok-a: $host"
    fi

    if ! samba-tool dns query localhost "$zone" "@" MX --machine-pass 2>/dev/null \
      | grep -qF "$fqdn"; then
      samba-tool dns add localhost "$zone" "@" MX "$fqdn" "$mx_prio" --machine-pass
      echo "added-mx: @ -> $fqdn ($mx_prio)"
      changed=1
    else
      echo "ok-mx: @"
    fi

    if [[ "$changed" -eq 1 ]]; then
      echo "changed: yes"
    fi
  args:
    executable: /bin/bash
  register: samba_dc_mail_relay_dns_result
  changed_when: "'changed: yes' in samba_dc_mail_relay_dns_result.stdout"
  when:
    - mail_relay_dns_enabled | bool
    - samba_sam_ldb.stat.exists
    - not ansible_check_mode
  tags: [samba_dns, samba_converge]
