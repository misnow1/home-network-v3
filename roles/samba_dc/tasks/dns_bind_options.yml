---
# BIND named.conf.options — query/recursion ACLs. Imported by dns_bind_dlz (bootstrap)
# and converge (ongoing ACL updates without re-provisioning).

- name: Samba DC DNS | Deploy named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
    validate: named-checkconf %s
  notify: restart named
  tags: [samba_dns, samba_converge]
