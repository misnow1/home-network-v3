---
# BIND9_DLZ wiring shared by bootstrap and restore (post sam.ldb exists).

- name: Samba DC DNS | Configure resolver to use local BIND
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # DC uses local BIND for {{ dc_domain_name }} AD DNS
      nameserver 127.0.0.1
      search {{ dc_domain_name }}
    owner: root
    group: root
    mode: "0644"
  tags: [samba_dns]

- name: Samba DC DNS | Deploy named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0644"
  notify: restart named
  tags: [samba_dns]

- name: Samba DC DNS | Wire Samba DLZ include into named.conf.local
  ansible.builtin.blockinfile:
    path: /etc/bind/named.conf.local
    block: |
      include "/var/lib/samba/bind-dns/named.conf";
    marker: "# {mark} ANSIBLE MANAGED BLOCK: samba-dlz"
    create: true
  notify: restart named
  tags: [samba_dns]

- name: Samba DC DNS | Deploy AppArmor local rules for BIND9_DLZ
  ansible.builtin.blockinfile:
    path: /etc/apparmor.d/local/usr.sbin.named
    block: |
      /var/lib/samba/bind-dns/** rwk,
      /var/lib/samba/bind-dns/dns.keytab rk,
      /var/lib/samba/private/krb5.conf r,
      /usr/lib/**/samba/bind9/** rmk,
      /usr/lib/**/samba/gensec/* rmk,
      /usr/lib/**/samba/ldb/** rmk,
      /usr/lib/**/ldb/modules/ldb/** rmk,
      /var/tmp/** rwmk,
    marker: "# {mark} ANSIBLE MANAGED BLOCK: samba-dlz"
    create: true
  notify: reload apparmor
  tags: [samba_dns]

- name: Samba DC DNS | Enable and start named
  ansible.builtin.service:
    name: named
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [samba_dns]

- name: Samba DC DNS | Unmask and enable samba-ad-dc
  ansible.builtin.systemd:
    name: samba-ad-dc
    masked: false
    enabled: true
  tags: [samba_provision]

- name: Samba DC DNS | Start samba-ad-dc
  ansible.builtin.service:
    name: samba-ad-dc
    state: started
  when: not ansible_check_mode
  tags: [samba_provision]

- name: Samba DC DNS | Copy generated krb5.conf to /etc/krb5.conf
  ansible.builtin.copy:
    src: /var/lib/samba/private/krb5.conf
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
    remote_src: true
  tags: [samba_kerberos]
