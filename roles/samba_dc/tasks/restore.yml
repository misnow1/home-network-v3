---
# One-shot Samba AD DC restore from domain backup. Imported only by playbooks/dc-restore.yml.
# smb.conf is generated by samba-tool — never template it here.

- name: DC restore | Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [samba_packages]

- name: DC restore | Install Samba AD DC packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
  tags: [samba_packages]

- name: DC restore | Mask conflicting Samba services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - smbd
    - nmbd
    - winbind
  failed_when: false
  tags: [samba_provision]

- name: DC restore | Mask systemd-resolved (DC uses BIND on port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false
  tags: [samba_provision]

- name: DC restore | Check if domain already exists on host
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb
  changed_when: false
  tags: [samba_provision]

- name: DC restore | Assert host is not already provisioned
  ansible.builtin.assert:
    that:
      - not samba_sam_ldb.stat.exists
    fail_msg: >-
      /var/lib/samba/private/sam.ldb already exists — dc-restore is for fresh hosts only.
      Use dc-converge.yml for ongoing configuration.
  tags: [samba_provision]

- name: DC restore | Assert backup archive is configured
  ansible.builtin.assert:
    that:
      - samba_dc_backup_archive | length > 0
    fail_msg: >-
      Set samba_dc_backup_archive to the path of a samba-tool domain backup tarball
      (control-node path for copy, or absolute path already on the DC).
  tags: [samba_provision]

- name: DC restore | Ensure backup staging directory exists
  ansible.builtin.file:
    path: "{{ samba_dc_backup_staged_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [samba_provision]

- name: DC restore | Copy backup archive from control node
  ansible.builtin.copy:
    src: "{{ samba_dc_backup_archive }}"
    dest: "{{ samba_dc_backup_staged_path }}/{{ samba_dc_backup_archive | basename }}"
    owner: root
    group: root
    mode: "0600"
  register: samba_dc_backup_copy
  when: not samba_dc_backup_archive.startswith('/')
  tags: [samba_provision]

- name: DC restore | Resolve backup archive path on target
  ansible.builtin.set_fact:
    samba_dc_backup_remote_path: >-
      {{
        samba_dc_backup_staged_path ~ '/' ~ (samba_dc_backup_archive | basename)
        if not samba_dc_backup_archive.startswith('/')
        else samba_dc_backup_archive
      }}
  tags: [samba_provision]

- name: DC restore | Assert backup archive exists on target
  ansible.builtin.stat:
    path: "{{ samba_dc_backup_remote_path }}"
  register: samba_dc_backup_stat
  tags: [samba_provision]

- name: DC restore | Assert backup archive is present
  ansible.builtin.assert:
    that:
      - samba_dc_backup_stat.stat.exists
      - samba_dc_backup_stat.stat.isreg
    fail_msg: "Backup archive not found at {{ samba_dc_backup_remote_path }}"
  tags: [samba_provision]

- name: DC restore | Assert ansible_host is set for restore IP
  ansible.builtin.assert:
    that:
      - ansible_host is defined
      - ansible_host | length > 0
    fail_msg: >-
      Set ansible_host to the DC IP in production inventory (required for
      samba-tool domain backup restore --host-ip).
  tags: [samba_provision]

- name: DC restore | Restore Samba AD domain from backup
  ansible.builtin.command:
    cmd: >-
      samba-tool domain backup restore
      {{ samba_dc_backup_remote_path }}
      --targetdir=/var/lib/samba
      --newservername={{ samba_dc_target_server_name | upper }}
      --host-ip={{ ansible_host | default(inventory_hostname) }}
    creates: /var/lib/samba/private/sam.ldb
  tags: [samba_provision]

- name: DC restore | Mark host as restored from backup
  ansible.builtin.file:
    path: "{{ samba_dc_restore_marker_path }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
  tags: [samba_provision]

- name: DC restore | Configure BIND DLZ and start directory services
  ansible.builtin.import_tasks: dns_bind_dlz.yml
