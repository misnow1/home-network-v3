---
# After smb.conf is managed by smb_conf_deploy.yml, this file only prunes stale
# DC hostname A/AAAA records (e.g. keepalived VIP or Docker bridge leftovers).

- name: Samba DC interfaces | Resolve effective interface list
  ansible.builtin.import_tasks: samba_interfaces_resolve.yml
  when: samba_dc_bind_interfaces_only | bool
  tags: [samba_dns, samba_converge, samba_provision]

- name: Samba DC interfaces | Check if domain is provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_dc_interfaces_sam_ldb
  changed_when: false
  when: samba_dc_bind_interfaces_only | bool
  tags: [samba_dns, samba_converge, samba_provision]

- name: Samba DC interfaces | Apply pending Samba restart before DNS refresh
  ansible.builtin.meta: flush_handlers
  when:
    - samba_dc_bind_interfaces_only | bool
    - samba_dc_interfaces_sam_ldb.stat.exists
    - not ansible_check_mode
  tags: [samba_dns, samba_converge, samba_provision]

- name: Samba DC interfaces | Deploy DNS prune script
  ansible.builtin.template:
    src: prune-dc-dns.sh.j2
    dest: "{{ samba_dc_dns_prune_script }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - samba_dc_bind_interfaces_only | bool
    - samba_dc_interfaces_sam_ldb.stat.exists
  tags: [samba_dns, samba_converge, samba_provision]

- name: Samba DC interfaces | Prune stale DC hostname DNS records and refresh
  ansible.builtin.command:
    argv:
      - "{{ samba_dc_dns_prune_script }}"
  register: samba_dc_interfaces_dns_prune
  changed_when: "'dns-records-pruned' in samba_dc_interfaces_dns_prune.stdout"
  when:
    - samba_dc_bind_interfaces_only | bool
    - samba_dc_interfaces_sam_ldb.stat.exists
    - not ansible_check_mode
  tags: [samba_dns, samba_converge, samba_provision]
