---
# Ensure AD DNS reverse zones exist for GSS-TSIG PTR updates (Slice 6).

- name: DC reverse zones | Check if domain is provisioned
  ansible.builtin.stat:
    path: /var/lib/samba/private/sam.ldb
  register: samba_sam_ldb
  changed_when: false
  tags: [samba_dns, samba_converge]

- name: DC reverse zones | Ensure Samba DNS reverse zones exist
  ansible.builtin.shell: |
    set -euo pipefail
    # Use the local machine account (--machine-pass): no Administrator secret
    # in argv or env, and no drift when the vault password is rotated.
    list=$(samba-tool dns zonelist 127.0.0.1 --machine-pass)
    for z in {% for zone in samba_dc_reverse_zones %}{{ zone | quote }} {% endfor %}; do
      zre=${z//./\\.}
      if printf '%s\n' "$list" | grep -qE "(^|[^[:alnum:].-])${zre}([^[:alnum:].-]|$)"; then
        echo "exists: $z"
        continue
      fi
      samba-tool dns zonecreate 127.0.0.1 "$z" --machine-pass
      echo "created: $z"
    done
  args:
    executable: /bin/bash
  register: samba_dc_reverse_zones_result
  changed_when: "'created:' in samba_dc_reverse_zones_result.stdout"
  when:
    - samba_dc_reverse_zones | length > 0
    - samba_sam_ldb.stat.exists
  tags: [samba_dns, samba_converge]

- name: DC reverse zones | Restart named after creating reverse zones
  ansible.builtin.service:
    name: named
    state: restarted
  when:
    - samba_dc_reverse_zones_result is defined
    - "'created:' in samba_dc_reverse_zones_result.stdout"
    - not ansible_check_mode
  tags: [samba_dns, samba_converge]
