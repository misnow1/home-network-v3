---
backup_restic_repository: /var/lib/restic/lab-backup
backup_restic_password_file: /root/.restic-password
backup_scope_dir: /etc/ansible-managed
backup_scope_path: /etc/ansible-managed/backup_scope.yml
backup_docker_script_path: /usr/local/bin/backup-docker.sh

backup_libvirt_vms: []
backup_docker_volumes: []

backup_docker_require_existing_paths: false

backup_valid_backup_policies:
  - snapshot
  - offline_copy
  - exclude

backup_valid_backup_classes:
  - crash_consistent
  - app_consistent
