---
- name: Backup | Require vault repository password
  ansible.builtin.assert:
    that:
      - vault_backup_repository_key is defined
      - vault_backup_repository_key | length > 0
    fail_msg: Set vault_backup_repository_key in lab vault before enabling backups.
  tags: [backup_credentials]

- name: Backup | Deploy restic password file
  ansible.builtin.copy:
    content: "{{ vault_backup_repository_key }}"
    dest: "{{ backup_restic_password_file }}"
    owner: root
    group: root
    mode: "0400"
  no_log: true
  tags: [backup_credentials]
