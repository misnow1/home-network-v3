---
domain_name: lab.test

fileserver_dns_servers: []

# When false, the role does not touch /etc/resolv.conf. Also skipped when
# fileserver_dns_servers is empty, so the role never writes a nameserver-less
# resolv.conf or clobbers a working systemd-resolved symlink.
fileserver_manage_resolv_conf: true

# When false, samba_fileserver role is skipped (playbook when:). Use on hosts with
# hand-maintained smb.conf until production multi-share support lands (ROADMAP 19+).
fileserver_samba_enabled: true

fileserver_idmap_ad_range: "10000-999999"
fileserver_idmap_tdb_range: "2000-9999"
fileserver_share_name: labshare
fileserver_share_path: /srv/samba/labshare
fileserver_valid_users_group: "labusers"

fileserver_template_homedir: /home/%U
fileserver_template_shell: /bin/bash

# Lab inventory sets samba_workgroup / samba_realm in group_vars/all/vars.yml.
samba_workgroup: LAB
samba_realm: LAB.TEST
