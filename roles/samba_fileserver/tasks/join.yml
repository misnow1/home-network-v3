---
- name: File server | Assert host is not a DC
  ansible.builtin.assert:
    that:
      - inventory_hostname not in groups.get('dc', [])
    fail_msg: >-
      samba_fileserver role must not run on DC hosts. Use samba_dc instead.
  tags: [always]

- name: File server | Configure resolver for AD DNS
  # follow: false replaces the systemd-resolved stub symlink with a static
  # file so AD DNS persists across reboots. Netplan/resolver integration for
  # production is documented in docs/production-runbook.md (static resolv.conf for now).
  # Guarded so an empty fileserver_dns_servers never yields a nameserver-less
  # resolv.conf (would break DNS) or clobbers a working systemd-resolved symlink.
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    follow: false
    content: |
      # Samba file server — use lab AD DNS
      {% for ns in fileserver_dns_servers %}
      nameserver {{ ns }}
      {% endfor %}
      search {{ domain_name }}
    owner: root
    group: root
    mode: "0644"
  when:
    - fileserver_manage_resolv_conf | bool
    - fileserver_dns_servers | length > 0
  tags: [fileserver_join]

- name: File server | Deploy smb.conf before domain join
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: testparm -s %s
  notify: restart samba fileserver
  tags: [fileserver_join]

- name: File server | Check current AD join status
  ansible.builtin.command: net ads testjoin
  register: fileserver_ads_testjoin
  changed_when: false
  failed_when: false
  tags: [fileserver_join]

- name: File server | Join AD domain (skipped if already joined)
  ansible.builtin.shell: |
    set -euo pipefail
    # Pass the password via the Samba PASSWD env var instead of user%password
    # in argv, which would be visible in the target process table.
    net ads join -U "${JOIN_USER}"
  args:
    executable: /bin/bash
  environment:
    JOIN_USER: "{{ vault_ad_join_user }}"
    PASSWD: "{{ vault_ad_join_password }}"
  when: fileserver_ads_testjoin.rc != 0
  no_log: true
  notify: restart samba fileserver
  tags: [fileserver_join]
