---
- name: Update grub
  ansible.builtin.command: update-grub
  listen: Update grub
  changed_when: true
  when: not ansible_check_mode

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  listen: Apply sysctl
  changed_when: false
  when: not ansible_check_mode

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: Reload systemd
  when: not ansible_check_mode

- name: Restart hypervisor thp
  ansible.builtin.systemd:
    name: hypervisor-thp.service
    state: restarted
  listen: Restart hypervisor thp
  when: not ansible_check_mode

- name: Restart libvirtd
  ansible.builtin.service:
    name: "{{ hypervisor_libvirt_service }}"
    state: restarted
  listen: restart libvirtd
  when: not ansible_check_mode

- name: Restart docker
  ansible.builtin.service:
    name: docker
    state: restarted
  listen: restart docker
  when: not ansible_check_mode

- name: Reload AppArmor cursor sandbox profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/cursor-sandbox-remote
  listen: Reload AppArmor cursor sandbox profile
  changed_when: true
  when: not ansible_check_mode
