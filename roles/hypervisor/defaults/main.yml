---
hypervisor_libvirt_enabled: true
hypervisor_libvirt_service: libvirtd
hypervisor_libvirt_image_dir: /var/lib/libvirt/images

hypervisor_libvirt_packages:
  - qemu-kvm
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - virt-manager
  - bridge-utils
  - python3-libvirt
  - python3-lxml
  - virt-top
  - guestfish
  - tcpdump

hypervisor_libvirt_users:
  - ansible

hypervisor_libvirt_uri: qemu:///system

# Opt-in LVM-backed libvirt storage. Empty list = libvirt on the root FS (lab hv01).
# Assumes the VG already exists; LVs are created only when missing and existing
# filesystems are never reformatted. Set VG + volumes in host_vars per host.
hypervisor_libvirt_volume_group: ""
hypervisor_libvirt_data_volumes: []
hypervisor_libvirt_data_volume_fstype: xfs
# fstab fields 4/5/6 (options, dump, passno) are passed separately to
# ansible.posix.mount — opts must NOT embed dump/passno or the module escapes the
# spaces (\040), producing an invalid options field that fails to mount at boot.
hypervisor_libvirt_data_volume_opts: defaults
hypervisor_libvirt_data_volume_dump: "0"
hypervisor_libvirt_data_volume_passno: "2"

# Host netplan (production hypervisors — disabled by default for lab nested VMs).
hypervisor_netplan_enabled: false
hypervisor_netplan_renderer: networkd
hypervisor_netplan_config_file: 01-hypervisor.yaml
hypervisor_netplan_uplink: ""
hypervisor_netplan_optional_nics: []
hypervisor_netplan_vlans: []
hypervisor_netplan_bridges: {}
# Production br0/br3 use hypervisor_netplan_uplink when interfaces are omitted:
#   br0 -> [uplink] with dhcp4: true; br3 -> [uplink.3] with no address.
# Pin br0's MAC to the uplink NIC (per host) so the DHCP reservation keeps the same
# IP after the uplink is enslaved into br0. Empty = let networkd derive br0's MAC.
# Set in host_vars: `ip link show <uplink>` -> link/ether. Overridden by an explicit
# `macaddress` in hypervisor_netplan_bridges.br0.
hypervisor_netplan_br0_macaddress: ""

# Libvirt bridge networks — set per environment (empty for lab nested hv01).
hypervisor_libvirt_networks: []

# VM storage layout under /var/lib/libvirt/images/home-network-v3/.
hypervisor_vm_data_base: /var/lib/libvirt/images/home-network-v3
hypervisor_vm_data_dir_owner: root
hypervisor_vm_data_dir_mode: "0775"
hypervisor_vm_data_dir_group: libvirt
# Paths under hypervisor_vm_data_base (includes legacy restore layouts).
hypervisor_vm_data_subdirs:
  - images
  - seeds
  - vm
  - lab
  - production
  - lab/vms
  - lab/seeds
  - production/vms
  - production/seeds

# Base storage pools — extend via hypervisor_libvirt_pools_extra in host_vars.
hypervisor_libvirt_pools:
  - name: default
    path: "{{ hypervisor_libvirt_image_dir }}"
    mode: "0711"
    owner: root
    group: root
  - name: vms
    path: "{{ hypervisor_vm_data_base }}/production/vms"
    mode: "{{ hypervisor_vm_data_dir_mode }}"
    owner: root
    group: "{{ hypervisor_vm_data_dir_group }}"

hypervisor_libvirt_pools_extra: []

docker_engine_enabled: true

docker_engine_users:
  - ansible
