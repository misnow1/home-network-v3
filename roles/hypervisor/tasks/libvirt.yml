---
- name: Libvirt | Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [libvirt]

- name: Libvirt | Install packages
  ansible.builtin.apt:
    name: "{{ hypervisor_libvirt_packages }}"
    state: present
  tags: [libvirt]

- name: Libvirt | Enable and start libvirtd
  ansible.builtin.service:
    name: "{{ hypervisor_libvirt_service }}"
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [libvirt]

- name: Libvirt | Ensure images directory exists
  ansible.builtin.file:
    path: "{{ hypervisor_libvirt_image_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  tags: [libvirt]

- name: Libvirt | Check whether default pool exists
  ansible.builtin.command: virsh pool-info {{ hypervisor_libvirt_pool_name }}
  register: hypervisor_pool_info
  changed_when: false
  failed_when: false
  tags: [libvirt]

- name: Libvirt | Define default directory pool
  ansible.builtin.command: >-
    virsh pool-define-as {{ hypervisor_libvirt_pool_name }} dir
    --target {{ hypervisor_libvirt_image_dir }}
  when: hypervisor_pool_info.rc != 0
  tags: [libvirt]

- name: Libvirt | Build default pool
  ansible.builtin.command: virsh pool-build {{ hypervisor_libvirt_pool_name }}
  when: hypervisor_pool_info.rc != 0
  tags: [libvirt]

- name: Libvirt | Start default pool
  ansible.builtin.command: virsh pool-start {{ hypervisor_libvirt_pool_name }}
  when: hypervisor_pool_info.rc != 0
  tags: [libvirt]

- name: Libvirt | Autostart default pool
  ansible.builtin.command: virsh pool-autostart {{ hypervisor_libvirt_pool_name }}
  when: hypervisor_pool_info.rc != 0
  changed_when: true
  tags: [libvirt]

- name: Libvirt | Add hypervisor users to libvirt group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: libvirt
    append: true
  loop: "{{ hypervisor_docker_users }}"
  tags: [libvirt]
