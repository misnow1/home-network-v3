---
- name: Hypervisor | Skip when libvirt stack disabled
  ansible.builtin.meta: end_host
  when: not hypervisor_libvirt_enabled | bool

- name: Hypervisor | Configure GRUB (IOMMU / menu timeout)
  ansible.builtin.include_tasks: grub.yml
  when: hypervisor_grub_manage | bool
  tags: [hypervisor_grub]

- name: Hypervisor | Configure host networking
  ansible.builtin.include_tasks: netplan.yml
  when: hypervisor_netplan_enabled | bool
  tags: [hypervisor_netplan]

- name: Hypervisor | Prepare dedicated libvirt storage
  ansible.builtin.include_tasks: storage.yml
  when: hypervisor_libvirt_data_volumes | length > 0
  tags: [libvirt, hypervisor_storage]

- name: Hypervisor | Install and configure libvirt
  ansible.builtin.include_tasks: libvirt.yml
  tags: [libvirt]

- name: Hypervisor | Configure Cursor Remote SSH sandbox
  ansible.builtin.include_tasks: cursor_sandbox.yml
  when: hypervisor_cursor_sandbox_enabled | bool
  tags: [cursor_sandbox, libvirt]

- name: Hypervisor | Configure libvirt users
  ansible.builtin.include_tasks: users.yml
  tags: [libvirt]

- name: Hypervisor | Ensure VM storage directories
  ansible.builtin.include_tasks: directories.yml
  tags: [libvirt]

- name: Hypervisor | Configure libvirt storage pools
  ansible.builtin.include_tasks: pools.yml
  tags: [libvirt]

- name: Hypervisor | Configure libvirt networks
  ansible.builtin.include_tasks: networks.yml
  tags: [hypervisor_networks]

- name: Hypervisor | Apply host performance tuning
  ansible.builtin.include_tasks: performance.yml
  when: hypervisor_perf_tuning_enabled | bool
  tags: [hypervisor_performance]

- name: Hypervisor | Install and configure Docker
  ansible.builtin.include_role:
    name: docker_engine
  when: docker_engine_enabled | bool
  tags: [docker]
