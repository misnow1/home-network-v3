---
# Lowest-precedence defaults. Lab inventory overrides in group_vars/linux/vars.yml.

domain_name: lab.test
domain_join_dns_servers: []
# When true and domain_join_dns_servers is non-empty, replace /etc/resolv.conf with a
# static file (breaks systemd-resolved stub). Default false — use DHCP/resolved on members.
domain_join_manage_resolv_conf: false
domain_member_allow_groups: []

# AD groups granted password sudo (AD password via pam_sss). AD display names are
# lowercased to match SSSD NSS output (e.g. getent group "Domain Admins" → domain admins).
domain_member_sudo_groups:
  - Domain Admins

sssd_ldap_id_mapping: false
sssd_use_fully_qualified_names: false
sssd_fall_back_homedir: /home/%u

# Opt-in sshd for members with Kerberized NFS homedirs (hypervisors, etc.).
# Bastion uses roles/bastion (GSSAPI-only, no password). Do not enable both patterns blindly.
domain_member_sshd_enabled: false
domain_member_sshd_gssapi: true
domain_member_sshd_authorized_keys_command: true
domain_member_sshd_password_authentication: true
domain_member_sshd_kbd_interactive: true
domain_member_sshd_gssapi_strict_acceptor_check: false

lab_test_user: labtest
lab_test_user_uid: 10001
lab_test_user_gid: 10001

# Internal mail relay client (Slice 16+) — members relay outbound mail to mail_relay_hostname.
# Set mail_relay_client_enabled in group_vars/linux/vars.yml on domain-joined members.
# Do NOT enable on hosts in the mail_relay group (they run the mail_relay server role).
mail_relay_client_enabled: false
mail_relay_hostname: mail.home.2123studios.com
mail_relay_manage_root_forward: false
