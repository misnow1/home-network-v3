---
- name: SSSD | Deploy sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart sssd
  tags: [domain_configure]

- name: SSSD | Enable and start sssd
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [domain_configure]

# sssd must be running the new services=-free config before the sockets are
# started, otherwise it still owns the responder socket paths and they fail to
# bind all over again.
- name: SSSD | Apply pending sssd restart before adopting sockets
  ansible.builtin.meta: flush_handlers
  tags: [domain_configure]

- name: SSSD | Adopt socket-activated responders
  when:
    - sssd_socket_activation | bool
    - not ansible_check_mode
  tags: [domain_configure]
  block:
    # A unit left `failed` by the old services= conflict stays failed until
    # something clears it, so reset before starting. sssd-pac.service fails as a
    # service (status=17) and is not reachable via its socket, hence both here.
    - name: SSSD | Clear stale responder failures # noqa: command-instead-of-module
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'reset-failed'] + sssd_responder_sockets + ['sssd-pac.service'] }}"
      changed_when: false
      failed_when: false

    - name: SSSD | Enable and start responder sockets
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ sssd_responder_sockets }}"

- name: SSSD | Check whether pam_mkhomedir is enabled
  ansible.builtin.shell: |
    grep -q 'pam_mkhomedir.so' /etc/pam.d/common-session
  args:
    executable: /bin/bash
  register: mkhomedir_enabled
  changed_when: false
  failed_when: false
  tags: [domain_configure]

- name: SSSD | Enable pam_mkhomedir
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  when: mkhomedir_enabled.rc != 0
  tags: [domain_configure]

- name: SSSD | Ensure oddjobd is started and enabled
  ansible.builtin.service:
    name: oddjobd
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [domain_configure]

- name: Kerberos | Fix Ubuntu includedir and enable sssd-kcm
  ansible.builtin.include_tasks: krb5.yml
  tags: [domain_configure, domain_krb5]
