---
- name: SSSD | Deploy sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: restart sssd
  tags: [domain_configure]

- name: SSSD | Enable and start sssd
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [domain_configure]

- name: SSSD | Check whether pam_mkhomedir is enabled
  ansible.builtin.shell: |
    grep -q 'pam_mkhomedir.so' /etc/pam.d/common-session
  args:
    executable: /bin/bash
  register: mkhomedir_enabled
  changed_when: false
  failed_when: false
  tags: [domain_configure]

- name: SSSD | Enable pam_mkhomedir
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  when: mkhomedir_enabled.rc != 0
  tags: [domain_configure]

- name: SSSD | Ensure oddjobd is started and enabled
  ansible.builtin.service:
    name: oddjobd
    state: started
    enabled: true
  when: not ansible_check_mode
  tags: [domain_configure]
