---
- name: Install domain join packages
  ansible.builtin.include_tasks: packages.yml
  when:
    - domain_join_enabled | bool
    - domain_join_ad_supported | bool
  tags: [domain_packages]

- name: Join AD domain
  ansible.builtin.include_tasks: join.yml
  when:
    - domain_join_enabled | bool
    - domain_join_ad_supported | bool
  tags: [domain_join]

- name: Configure SSSD and PAM homedir
  ansible.builtin.include_tasks: configure.yml
  when:
    - domain_join_enabled | bool
    - domain_join_ad_supported | bool
  tags: [domain_configure, domain_krb5]

- name: Configure sshd for domain member login
  ansible.builtin.include_tasks: sshd.yml
  when:
    - domain_join_enabled | bool
    - domain_join_ad_supported | bool
    - domain_member_sshd_enabled | bool
  tags: [domain_sshd]

- name: Configure sudo for domain groups
  ansible.builtin.include_tasks: sudo.yml
  when:
    - domain_join_enabled | bool
    - domain_join_ad_supported | bool
  tags: [domain_sudo]

# Independent of AD — runs even when domain_join_enabled is false.
- name: Configure Postfix relay client
  ansible.builtin.include_tasks: postfix_relayclient.yml
  when:
    - mail_relay_client_enabled | bool
    - "'mail_relay' not in group_names"
  tags: [domain_mail_relay]
