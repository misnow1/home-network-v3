---
- name: Sudo | Deploy sudoers for domain member groups
  ansible.builtin.template:
    src: domain-sudoers.j2
    dest: /etc/sudoers.d/domain-member-groups
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: domain_member_sudo_groups | length > 0
  tags: [domain_configure, domain_sudo]

- name: Sudo | Remove sudoers when no domain groups configured
  ansible.builtin.file:
    path: /etc/sudoers.d/domain-member-groups
    state: absent
  when: domain_member_sudo_groups | length == 0
  tags: [domain_configure, domain_sudo]
