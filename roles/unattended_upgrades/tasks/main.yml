---
- name: Unattended upgrades | Install and configure
  when: unattended_upgrades_enabled | bool
  tags: [unattended_upgrades]
  block:
    - name: Unattended upgrades | Install apt packages
      ansible.builtin.apt:
        name: "{{ unattended_upgrades_packages }}"
        state: present

    - name: Unattended upgrades | Deploy unattended-upgrades configuration
      ansible.builtin.template:
        src: 50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Unattended upgrades | Enable periodic unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Unattended upgrades | Configure needrestart overrides
      when: unattended_upgrades_needrestart_manage | bool
      block:
        - name: Unattended upgrades | Skip needrestart systemd daemon-reexec hook
          ansible.builtin.template:
            src: needrestart-ansible.conf.j2
            dest: /etc/needrestart/conf.d/90-ansible.conf
            owner: root
            group: root
            mode: "0644"
            validate: perl -c %s
          when: unattended_upgrades_needrestart_skip_systemd_manager | bool

        - name: Unattended upgrades | Restore needrestart systemd daemon-reexec hook
          ansible.builtin.file:
            path: /etc/needrestart/conf.d/90-ansible.conf
            state: absent
          when: not (unattended_upgrades_needrestart_skip_systemd_manager | bool)
