---
# Structural tests for backup role layout.

- name: Structural — backup layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    scope_tasks: "{{ repo_root }}/roles/backup/tasks/scope.yml"
    backup_playbook: "{{ repo_root }}/playbooks/backup.yml"
    docker_script: "{{ repo_root }}/roles/backup/templates/backup-docker.sh.j2"
  tasks:
    - name: Backup | assert scope task validates backup_class
      ansible.builtin.shell: |
        grep -q 'backup_valid_backup_classes' "{{ scope_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Backup | assert playbook targets hypervisors group
      ansible.builtin.shell: |
        grep -q 'hosts: hypervisors' "{{ backup_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Backup | assert docker backup script uses local restic repository
      ansible.builtin.shell: |
        grep -q 'RESTIC_REPOSITORY=' "{{ docker_script }}"
        grep -q 'backup_restic_repository' "{{ docker_script }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Backup | assert scheduled backup tasks and units exist
      ansible.builtin.shell: |
        grep -q 'backup_schedule' "{{ repo_root }}/roles/backup/tasks/main.yml"
        test -f "{{ repo_root }}/roles/backup/tasks/schedule.yml"
        test -f "{{ repo_root }}/roles/backup/templates/backup-run.sh.j2"
        test -f "{{ repo_root }}/roles/backup/templates/backup.timer.j2"
        test -f "{{ repo_root }}/roles/backup/templates/backup-paths.sh.j2"
        test -f "{{ repo_root }}/roles/backup/templates/backup-ad.sh.j2"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Backup | assert every notify string resolves to a handler name or listen
      ansible.builtin.shell: |
        set -euo pipefail
        handlers="{{ repo_root }}/roles/backup/handlers/main.yml"
        missing=0
        while read -r target; do
          [ -z "$target" ] && continue
          grep -qE "^[[:space:]]*(- name|[[:space:]]*listen):[[:space:]]*${target}$" "$handlers" || {
            echo "notify '${target}' has no matching handler name or listen" >&2
            missing=1
          }
        done < <(grep -rh 'notify:' "{{ repo_root }}/roles/backup/tasks/" | sed 's/.*notify:[[:space:]]*//' | sort -u)
        exit "$missing"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Backup | assert wrapper fails closed and uses valid restic copy flags
      ansible.builtin.shell: |
        grep -q 'flock -n' "{{ repo_root }}/roles/backup/templates/backup-run.sh.j2"
        grep -q 'skipped because backup failed' "{{ repo_root }}/roles/backup/templates/backup-run.sh.j2"
        grep -q -- '--from-repo' "{{ repo_root }}/roles/backup/templates/backup-run.sh.j2"
        grep -q -- '--from-password-file' "{{ repo_root }}/roles/backup/templates/backup-run.sh.j2"
        if grep -q -- '--to-repo' "{{ repo_root }}/roles/backup/templates/backup-run.sh.j2"; then
          echo "invalid restic flag --to-repo still present" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
