---
# Structural tests for role-based software layout.

- name: Structural — software layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    baseline_vars: "{{ repo_root }}/roles/linux_baseline/vars/main.yml"
    baseline_defaults: "{{ repo_root }}/roles/linux_baseline/defaults/main.yml"
    baseline_tasks: "{{ repo_root }}/roles/linux_baseline/tasks/main.yml"
    github_releases_task: "{{ repo_root }}/roles/linux_baseline/tasks/github_releases.yml"
    github_release_item_task: "{{ repo_root }}/roles/linux_baseline/tasks/github_release_item.yml"
    shell_task: "{{ repo_root }}/roles/linux_baseline/tasks/shell.yml"
    zsh_dropin: "{{ repo_root }}/roles/linux_baseline/files/etc/zsh/zshrc.d/99-fzf.zsh"
    bash_dropin: "{{ repo_root }}/roles/linux_baseline/files/etc/bash.bashrc.d/99-fzf.sh"
    zsh_pyenv_dropin: "{{ repo_root }}/roles/linux_baseline/files/etc/zsh/zshrc.d/99-pyenv.zsh"
    bash_pyenv_dropin: "{{ repo_root }}/roles/linux_baseline/files/etc/bash.bashrc.d/99-pyenv.sh"
    zsh_uv_dropin: "{{ repo_root }}/roles/linux_baseline/files/etc/zsh/zshrc.d/99-uv.zsh"
    bash_uv_dropin: "{{ repo_root }}/roles/linux_baseline/files/etc/bash.bashrc.d/99-uv.sh"
    samba_defaults: "{{ repo_root }}/roles/samba_dc/defaults/main.yml"
    software_doc: "{{ repo_root }}/docs/software.md"
  tasks:
    - name: Software | assert required paths exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: software_paths
      loop:
        - "{{ baseline_vars }}"
        - "{{ baseline_defaults }}"
        - "{{ baseline_tasks }}"
        - "{{ github_releases_task }}"
        - "{{ github_release_item_task }}"
        - "{{ shell_task }}"
        - "{{ zsh_dropin }}"
        - "{{ bash_dropin }}"
        - "{{ zsh_pyenv_dropin }}"
        - "{{ bash_pyenv_dropin }}"
        - "{{ zsh_uv_dropin }}"
        - "{{ bash_uv_dropin }}"
        - "{{ software_doc }}"

    - name: Software | assert paths present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing required path: {{ item.item }}"
      loop: "{{ software_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Software | assert baseline includes shared admin packages
      ansible.builtin.shell: |
        grep -q 'htop' "{{ baseline_vars }}"
        grep -q 'zsh' "{{ baseline_vars }}"
        grep -q 'dnsutils' "{{ baseline_vars }}"
        grep -q 'tmux' "{{ baseline_vars }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Software | assert fzf GitHub release is configured
      ansible.builtin.shell: |
        grep -q 'linux_baseline_github_releases:' "{{ baseline_defaults }}"
        grep -q 'name: fzf' "{{ baseline_defaults }}"
        grep -q 'name: uv' "{{ baseline_defaults }}"
        grep -q 'linux_baseline_pyenv_enabled: false' "{{ baseline_defaults }}"
        grep -q 'linux_baseline_pyenv_version:' "{{ baseline_defaults }}"
        grep -q 'version:' "{{ baseline_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Software | assert pyenv build packages are listed
      ansible.builtin.shell: |
        grep -q 'linux_baseline_pyenv_build_packages:' "{{ baseline_vars }}"
        grep -q 'build-essential' "{{ baseline_vars }}"
        grep -q 'pkg-config' "{{ baseline_vars }}"
        grep -q 'libssl-dev' "{{ baseline_vars }}"
        grep -q 'libreadline-dev' "{{ baseline_vars }}"
        grep -q 'libffi-dev' "{{ baseline_vars }}"
        grep -q 'libzstd-dev' "{{ baseline_vars }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Software | assert baseline tasks wire github releases and shell drop-ins
      ansible.builtin.shell: |
        grep -q 'github_releases.yml' "{{ baseline_tasks }}"
        grep -q 'pyenv.yml' "{{ baseline_tasks }}"
        grep -q 'linux_baseline_pyenv_enabled' "{{ baseline_tasks }}"
        grep -q 'github_release_item.yml' "{{ github_releases_task }}"
        grep -q 'shell.yml' "{{ baseline_tasks }}"
        grep -q 'timezone.yml' "{{ baseline_tasks }}"
        grep -q 'linux_baseline_timezone:' "{{ baseline_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Software | assert root console break-glass defaults and tasks exist
      ansible.builtin.shell: |
        grep -q 'linux_baseline_root_console_enabled: false' "{{ baseline_defaults }}" &&
        grep -q 'root_console.yml' "{{ baseline_tasks }}" &&
        test -f "{{ repo_root }}/roles/linux_baseline/tasks/root_console.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Software | assert DC packages include ldb-tools and debug tools
      ansible.builtin.shell: |
        grep -q 'ldb-tools' "{{ samba_defaults }}"
        grep -q 'tcpdump' "{{ samba_defaults }}"
        grep -q 'nmap' "{{ samba_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Software | assert unattended upgrades role and docs are referenced
      ansible.builtin.shell: |
        grep -q 'unattended_upgrades' "{{ repo_root }}/playbooks/security-updates.yml" &&
        grep -q 'unattended-upgrades' "{{ software_doc }}" &&
        test -f "{{ repo_root }}/roles/unattended_upgrades/defaults/main.yml"
      args:
        executable: /bin/bash
      changed_when: false
