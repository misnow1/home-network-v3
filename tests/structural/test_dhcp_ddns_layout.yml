---
# Structural tests for Slice 9 DHCP-driven DDNS layout.

- name: Structural — DHCP DDNS layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    ddns_api_playbook: "{{ repo_root }}/playbooks/ddns-api.yml"
    ddns_nsupdate_tasks: "{{ repo_root }}/roles/ddns_nsupdate/tasks/main.yml"
    docker_engine_tasks: "{{ repo_root }}/roles/docker_engine/tasks/main.yml"
    hook_script: "{{ repo_root }}/scripts/dhcp-ddns-hook.sh"
    parse_lib: "{{ repo_root }}/scripts/lib/dhcp-ddns-parse.sh"
    docker_app: "{{ repo_root }}/docker/ddns-nsupdate/app.py"
    hook_ensure: "{{ repo_root }}/scripts/lab/ddns-hook-ensure.sh"
    vm_create_dhcp: "{{ repo_root }}/scripts/lab/vm-create-dhcp.sh"
  tasks:
    - name: DHCP DDNS | assert ddns-api playbook targets dc group
      ansible.builtin.shell: |
        grep -q 'hosts: dc' "{{ ddns_api_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: DHCP DDNS | assert ddns_nsupdate requires docker and secret
      ansible.builtin.shell: |
        grep -q 'docker_engine_enabled' "{{ ddns_nsupdate_tasks }}"
        grep -q 'vault_ddns_shared_secret' "{{ ddns_nsupdate_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: DHCP DDNS | assert docker_engine role exists
      ansible.builtin.stat:
        path: "{{ docker_engine_tasks }}"
      register: docker_engine_stat

    - name: DHCP DDNS | assert docker_engine tasks present
      ansible.builtin.assert:
        that:
          - docker_engine_stat.stat.exists
        fail_msg: Missing docker_engine role tasks

    - name: DHCP DDNS | assert hook and docker project exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: dhcp_ddns_paths
      loop:
        - "{{ hook_script }}"
        - "{{ parse_lib }}"
        - "{{ docker_app }}"
        - "{{ hook_ensure }}"
        - "{{ vm_create_dhcp }}"

    - name: DHCP DDNS | assert required paths exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing required path: {{ item.item }}"
      loop: "{{ dhcp_ddns_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: DHCP DDNS | assert lab network template defines dhcp-script
      ansible.builtin.shell: |
        grep -q 'dhcp-script=${LAB_DDNS_HOOK}' \
          "{{ repo_root }}/scripts/lab/libvirt/lab-network.xml.tmpl"
      args:
        executable: /bin/bash
      changed_when: false
