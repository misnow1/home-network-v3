---
# Structural tests for reimage helper scripts (Slice 19 — complete).

- name: Structural — reimage layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    preflight_script: "{{ repo_root }}/scripts/reimage/preflight-check.sh"
    capture_script: "{{ repo_root }}/scripts/reimage/inventory-capture.sh"
    backup_script: "{{ repo_root }}/scripts/reimage/inventory-backup.sh"
    reimage_lib: "{{ repo_root }}/scripts/reimage/reimage-lib.sh"
  tasks:
    - name: Reimage | assert scripts exist and are executable
      ansible.builtin.stat:
        path: "{{ item }}"
      register: reimage_scripts
      loop:
        - "{{ preflight_script }}"
        - "{{ capture_script }}"
        - "{{ backup_script }}"
        - "{{ reimage_lib }}"

    - name: Reimage | assert scripts executable
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable
        fail_msg: "Missing or not executable: {{ item.item }}"
      loop: "{{ reimage_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Reimage | assert capture script references kif services
      ansible.builtin.command: grep -F 'reimage_capture_kif_services' "{{ capture_script }}"
      changed_when: false

    - name: Reimage | assert capture script copies autofs config
      ansible.builtin.command: grep -F 'auto.home' "{{ reimage_lib }}"
      changed_when: false

    - name: Reimage | assert ubuntu autoinstall builder exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/scripts/reimage/ubuntu-autoinstall/build-user-data.sh"
      register: autoinstall_builder

    - name: Reimage | assert autoinstall builder executable
      ansible.builtin.assert:
        that:
          - autoinstall_builder.stat.exists
          - autoinstall_builder.stat.executable

    - name: Reimage | assert inventory cloud-init generator exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/scripts/reimage/cloud-init-from-inventory.sh"
      register: inventory_cidata

    - name: Reimage | assert inventory cloud-init generator executable
      ansible.builtin.assert:
        that:
          - inventory_cidata.stat.exists
          - inventory_cidata.stat.executable

    - name: Reimage | assert bare_metal_simple template exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/scripts/reimage/ubuntu-autoinstall/bare-metal-simple-user-data.tmpl"
      register: bare_metal_tmpl

    - name: Reimage | assert bare_metal_simple template present
      ansible.builtin.assert:
        that:
          - bare_metal_tmpl.stat.exists

    - name: Reimage | assert ROADMAP documents slice 19 complete
      ansible.builtin.command: grep -F 'kif/kvm01 Ubuntu reimage' "{{ repo_root }}/docs/ROADMAP.md"
      changed_when: false
