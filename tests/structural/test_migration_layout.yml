---
# Structural tests for AD migration artifacts.

- name: Structural — migration layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    migration_runbook: "{{ repo_root }}/docs/migration-runbook.md"
    dc_restore_playbook: "{{ repo_root }}/playbooks/dc-restore.yml"
    dc_restore_tasks: "{{ repo_root }}/roles/samba_dc/tasks/restore.yml"
    dns_bind_tasks: "{{ repo_root }}/roles/samba_dc/tasks/dns_bind_dlz.yml"
    bootstrap_tasks: "{{ repo_root }}/roles/samba_dc/tasks/bootstrap.yml"
    domain_leave_playbook: "{{ repo_root }}/playbooks/domain-leave.yml"
    preflight_script: "{{ repo_root }}/scripts/migration/preflight-check.sh"
  tasks:
    - name: Migration | assert migration runbook exists
      ansible.builtin.stat:
        path: "{{ migration_runbook }}"
      register: migration_runbook_stat

    - name: Migration | assert migration runbook present
      ansible.builtin.assert:
        that:
          - migration_runbook_stat.stat.exists

    - name: Migration | assert dc-restore playbook has allow_production guard
      ansible.builtin.shell: |
        grep -q 'allow_production' "{{ dc_restore_playbook }}"
        grep -q 'tasks_from: restore' "{{ dc_restore_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Migration | assert restore tasks call samba-tool domain backup restore
      ansible.builtin.shell: |
        grep -q 'samba-tool domain backup restore' "{{ dc_restore_tasks }}"
        grep -q 'creates: /var/lib/samba/private/sam.ldb' "{{ dc_restore_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Migration | assert bootstrap refuses migration hosts
      ansible.builtin.shell: |
        grep -q 'samba_dc_migration_host' "{{ bootstrap_tasks }}"
        grep -q 'samba_dc_restore_marker_path' "{{ bootstrap_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Migration | assert shared DNS tasks exist
      ansible.builtin.stat:
        path: "{{ dns_bind_tasks }}"
      register: dns_bind_stat

    - name: Migration | assert dns_bind_dlz.yml present
      ansible.builtin.assert:
        that:
          - dns_bind_stat.stat.exists

    - name: Migration | assert domain-leave playbook exists
      ansible.builtin.stat:
        path: "{{ domain_leave_playbook }}"
      register: domain_leave_stat

    - name: Migration | assert domain-leave playbook present
      ansible.builtin.assert:
        that:
          - domain_leave_stat.stat.exists

    - name: Migration | assert preflight script exists and is executable
      ansible.builtin.stat:
        path: "{{ preflight_script }}"
      register: preflight_stat

    - name: Migration | assert preflight script present
      ansible.builtin.assert:
        that:
          - preflight_stat.stat.exists
          - preflight_stat.stat.executable

    - name: Migration | assert hosts example uses dc1 naming
      ansible.builtin.shell: |
        grep -q 'dc1.example.home' "{{ repo_root }}/inventories/production/hosts.yml.example"
        grep -q 'deferred:' "{{ repo_root }}/inventories/production/hosts.yml.example"
      args:
        executable: /bin/bash
      changed_when: false
