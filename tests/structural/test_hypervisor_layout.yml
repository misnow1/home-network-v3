---
# Structural tests for hypervisor role layout.

- name: Structural — hypervisor layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    hypervisor_role: "{{ repo_root }}/roles/hypervisor"
    libvirt_defaults: "{{ hypervisor_role }}/defaults/main.yml"
    hypervisor_playbook: "{{ repo_root }}/playbooks/hypervisor.yml"
    fileserver_playbook: "{{ repo_root }}/playbooks/fileserver.yml"
  tasks:
    - name: Hypervisor | assert libvirt packages include python3-libvirt and python3-lxml
      ansible.builtin.shell: |
        grep -q python3-libvirt "{{ libvirt_defaults }}" &&
        grep -q python3-lxml "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert hypervisor_libvirt_users in defaults
      ansible.builtin.shell: |
        grep -q hypervisor_libvirt_users "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert development tool packages in defaults
      ansible.builtin.shell: |
        grep -q 'hypervisor_dev_tool_packages:' "{{ libvirt_defaults }}" &&
        grep -q shellcheck "{{ libvirt_defaults }}" &&
        grep -q genisoimage "{{ libvirt_defaults }}" &&
        grep -q gettext-base "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert libvirt tasks install development tool packages
      ansible.builtin.shell: |
        grep -q 'hypervisor_dev_tool_packages' "{{ hypervisor_role }}/tasks/libvirt.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert task files exist
      ansible.builtin.stat:
        path: "{{ hypervisor_role }}/tasks/{{ item }}"
      register: hypervisor_task_file
      failed_when: not hypervisor_task_file.stat.exists
      loop:
        - netplan.yml
        - storage.yml
        - storage_volume.yml
        - users.yml
        - directories.yml
        - pools.yml
        - networks.yml

    - name: Hypervisor | assert defaults define libvirt storage variables
      ansible.builtin.shell: |
        grep -q 'hypervisor_libvirt_volume_group' "{{ libvirt_defaults }}" &&
        grep -q 'hypervisor_libvirt_data_volumes' "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert storage is gated on data_volumes length
      ansible.builtin.shell: |
        grep -q 'hypervisor_libvirt_data_volumes | length > 0' "{{ hypervisor_role }}/tasks/main.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert storage uses LVM and mount modules
      ansible.builtin.shell: |
        grep -q 'community.general.lvol' "{{ hypervisor_role }}/tasks/storage_volume.yml" &&
        grep -q 'ansible.posix.mount' "{{ hypervisor_role }}/tasks/storage_volume.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert templates exist
      ansible.builtin.stat:
        path: "{{ hypervisor_role }}/templates/{{ item }}"
      register: hypervisor_template
      failed_when: not hypervisor_template.stat.exists
      loop:
        - netplan.yaml.j2
        - libvirt-bridge-network.xml.j2

    - name: Hypervisor | assert community.libvirt used for pools and networks
      ansible.builtin.shell: |
        grep -q 'community.libvirt.virt_pool' "{{ hypervisor_role }}/tasks/pools.yml" &&
        grep -q 'community.libvirt.virt_net' "{{ hypervisor_role }}/tasks/networks.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert playbook uses serial 1
      ansible.builtin.shell: |
        grep -q 'serial: 1' "{{ hypervisor_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert playbook targets hypervisors group
      ansible.builtin.shell: |
        grep -q 'hosts: hypervisors' "{{ hypervisor_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert fileserver playbook includes gated hypervisor role
      ansible.builtin.shell: |
        grep -q 'role: hypervisor' "{{ fileserver_playbook }}" &&
        grep -q 'hypervisor_libvirt_enabled' "{{ fileserver_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false
