---
# Structural tests for hypervisor role layout.

- name: Structural — hypervisor layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    hypervisor_role: "{{ repo_root }}/roles/hypervisor"
    libvirt_defaults: "{{ hypervisor_role }}/defaults/main.yml"
    hypervisor_playbook: "{{ repo_root }}/playbooks/hypervisor.yml"
    fileserver_playbook: "{{ repo_root }}/playbooks/fileserver.yml"
  tasks:
    - name: Hypervisor | assert libvirt packages include python3-libvirt and python3-lxml
      ansible.builtin.shell: |
        grep -q python3-libvirt "{{ libvirt_defaults }}" &&
        grep -q python3-lxml "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert hypervisor_libvirt_users in defaults
      ansible.builtin.shell: |
        grep -q hypervisor_libvirt_users "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert development tool packages in defaults
      ansible.builtin.shell: |
        grep -q 'hypervisor_dev_tool_packages:' "{{ libvirt_defaults }}" &&
        grep -q shellcheck "{{ libvirt_defaults }}" &&
        grep -q genisoimage "{{ libvirt_defaults }}" &&
        grep -q gettext-base "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert libvirt tasks install development tool packages
      ansible.builtin.shell: |
        grep -q 'hypervisor_dev_tool_packages' "{{ hypervisor_role }}/tasks/libvirt.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert Cursor sandbox defaults and tasks exist
      ansible.builtin.shell: |
        grep -q 'hypervisor_cursor_sandbox_enabled' "{{ libvirt_defaults }}" &&
        grep -q 'hypervisor_cursor_sandbox_packages' "{{ libvirt_defaults }}" &&
        grep -q 'cursor_sandbox.yml' "{{ hypervisor_role }}/tasks/main.yml" &&
        test -f "{{ hypervisor_role }}/files/cursor-sandbox-remote"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert performance tuning defaults exist
      ansible.builtin.shell: |
        grep -q 'hypervisor_perf_tuning_enabled' "{{ libvirt_defaults }}" &&
        grep -q 'hypervisor_perf_tuned_profile' "{{ libvirt_defaults }}" &&
        grep -q 'hypervisor_perf_thp_policy' "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert performance tasks are gated in main.yml
      ansible.builtin.shell: |
        grep -q 'hypervisor_perf_tuning_enabled' "{{ hypervisor_role }}/tasks/main.yml" &&
        grep -q 'performance.yml' "{{ hypervisor_role }}/tasks/main.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert GRUB defaults and tasks exist
      ansible.builtin.shell: |
        grep -q 'hypervisor_grub_manage' "{{ libvirt_defaults }}" &&
        grep -q 'hypervisor_grub_cmdline_linux_extra' "{{ libvirt_defaults }}" &&
        grep -q 'grub.yml' "{{ hypervisor_role }}/tasks/main.yml" &&
        test -f "{{ hypervisor_role }}/tasks/grub.yml" &&
        test -f "{{ hypervisor_role }}/templates/grub-hypervisor.cfg.j2"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert performance baseline script exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/scripts/hypervisor/perf-baseline.sh"
      register: perf_baseline_script
      failed_when: not perf_baseline_script.stat.exists

    - name: Hypervisor | assert hypervisor performance doc exists
      ansible.builtin.stat:
        path: "{{ repo_root }}/docs/hypervisor-performance.md"
      register: perf_doc
      failed_when: not perf_doc.stat.exists

    - name: Hypervisor | assert task files exist
      ansible.builtin.stat:
        path: "{{ hypervisor_role }}/tasks/{{ item }}"
      register: hypervisor_task_file
      failed_when: not hypervisor_task_file.stat.exists
      loop:
        - netplan.yml
        - storage.yml
        - storage_volume.yml
        - performance.yml
        - grub.yml
        - users.yml
        - directories.yml
        - pools.yml
        - networks.yml
        - cursor_sandbox.yml

    - name: Hypervisor | assert defaults define libvirt storage variables
      ansible.builtin.shell: |
        grep -q 'hypervisor_libvirt_volume_group' "{{ libvirt_defaults }}" &&
        grep -q 'hypervisor_libvirt_data_volumes' "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert storage is gated on data_volumes length
      ansible.builtin.shell: |
        grep -q 'hypervisor_libvirt_data_volumes | length > 0' "{{ hypervisor_role }}/tasks/main.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert storage uses LVM and mount modules
      ansible.builtin.shell: |
        grep -q 'community.general.lvol' "{{ hypervisor_role }}/tasks/storage_volume.yml" &&
        grep -q 'ansible.posix.mount' "{{ hypervisor_role }}/tasks/storage_volume.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert templates exist
      ansible.builtin.stat:
        path: "{{ hypervisor_role }}/templates/{{ item }}"
      register: hypervisor_template
      failed_when: not hypervisor_template.stat.exists
      loop:
        - netplan.yaml.j2
        - libvirt-bridge-network.xml.j2

    - name: Hypervisor | assert community.libvirt used for pools and networks
      ansible.builtin.shell: |
        grep -q 'community.libvirt.virt_pool' "{{ hypervisor_role }}/tasks/pools.yml" &&
        grep -q 'community.libvirt.virt_net' "{{ hypervisor_role }}/tasks/networks.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert playbook uses serial 1
      ansible.builtin.shell: |
        grep -q 'serial: 1' "{{ hypervisor_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert playbook targets hypervisors group
      ansible.builtin.shell: |
        grep -q 'hosts: hypervisors' "{{ hypervisor_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert fileserver playbook includes gated hypervisor role
      ansible.builtin.shell: |
        grep -q 'role: hypervisor' "{{ fileserver_playbook }}" &&
        grep -q 'hypervisor_libvirt_enabled' "{{ fileserver_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert playbook includes host_firewall when enabled
      ansible.builtin.shell: |
        grep -q 'role: host_firewall' "{{ hypervisor_playbook }}" &&
        grep -q 'host_firewall_enabled' "{{ hypervisor_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert VLAN 4 docker edge network in production example
      ansible.builtin.shell: |
        grep -q 'vlan4' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q 'br4' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q "bridge_name == 'br4'" "{{ hypervisor_role }}/templates/netplan.yaml.j2" &&
        grep -q 'hypervisor_netplan_br4_address' "{{ libvirt_defaults }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert br0 pins Pi-hole DNS and rejects DHCP/RA DNS
      ansible.builtin.shell: |
        grep -q '192.168.1.18' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q '192.168.1.22' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q 'dhcp4-overrides:' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q 'ra-overrides:' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q 'use-dns: false' "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example" &&
        grep -q 'ra-overrides' "{{ hypervisor_role }}/templates/netplan.yaml.j2"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert netplan can remove unmanaged cloud-init drop-ins
      ansible.builtin.shell: |
        grep -q 'hypervisor_netplan_remove_unmanaged' "{{ libvirt_defaults }}"
        grep -q 'Remove unmanaged netplan files' "{{ hypervisor_role }}/tasks/netplan.yml"
        grep -q 'hypervisor_netplan_remove_unmanaged: true' \
          "{{ repo_root }}/inventories/production/group_vars/hypervisors/vars.yml.example"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Hypervisor | assert netplan derives brN interfaces from uplink.N
      ansible.builtin.shell: |
        grep -q "bridge_name is match('^br\\[0-9\\]+\\$')" \
          "{{ hypervisor_role }}/templates/netplan.yaml.j2"
        grep -q 'bridge_name\[2:\]' "{{ hypervisor_role }}/templates/netplan.yaml.j2"
        ! grep -q "bridge_name == 'br3'" "{{ hypervisor_role }}/templates/netplan.yaml.j2"
      args:
        executable: /bin/bash
      changed_when: false
