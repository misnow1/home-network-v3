---
# Structural tests for LDAP VIP (keepalived on DC pair).

- name: Structural — LDAP VIP layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    keepalived_role: "{{ repo_root }}/roles/keepalived_ldap/tasks/main.yml"
    dns_ldap_vip: "{{ repo_root }}/roles/samba_dc/tasks/dns_ldap_vip.yml"
    converge_tasks: "{{ repo_root }}/roles/samba_dc/tasks/converge.yml"
    dc_converge: "{{ repo_root }}/playbooks/dc-converge.yml"
    runbook: "{{ repo_root }}/docs/ldap-vip-runbook.md"
    dc_vars_example: "{{ repo_root }}/inventories/production/group_vars/dc/vars.yml.example"
  tasks:
    - name: LDAP VIP | assert role and DNS task exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ldap_vip_paths
      loop:
        - "{{ keepalived_role }}"
        - "{{ dns_ldap_vip }}"
        - "{{ repo_root }}/roles/keepalived_ldap/templates/keepalived.conf.j2"
        - "{{ repo_root }}/roles/keepalived_ldap/templates/check_ldaps.sh.j2"
        - "{{ repo_root }}/roles/keepalived_ldap/templates/ldap-vip-notify.sh.j2"
        - "{{ runbook }}"

    - name: LDAP VIP | assert files present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing required path: {{ item.item }}"
      loop: "{{ ldap_vip_paths.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: LDAP VIP | assert converge wiring and DNAT notify
      ansible.builtin.shell: |
        grep -q 'dns_ldap_vip.yml' "{{ converge_tasks }}"
        grep -q 'keepalived_ldap' "{{ dc_converge }}"
        grep -q 'ldap_vip_enabled' "{{ dc_vars_example }}"
        grep -q 'ldap.home.2123studios.com' "{{ runbook }}"
        grep -q 'notify_master' "{{ repo_root }}/roles/keepalived_ldap/templates/keepalived.conf.j2"
        grep -q 'dnat to' "{{ repo_root }}/roles/keepalived_ldap/templates/ldap-vip-notify.sh.j2"
        grep -q 'nftables DNAT' "{{ runbook }}"
      args:
        executable: /bin/bash
      changed_when: false
