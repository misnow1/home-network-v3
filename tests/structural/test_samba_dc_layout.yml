---
# Structural tests for Samba AD DC bootstrap/converge separation.

- name: Structural — Samba DC layout
  hosts: localhost
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    bootstrap_tasks: "{{ repo_root }}/roles/samba_dc/tasks/bootstrap.yml"
    main_tasks: "{{ repo_root }}/roles/samba_dc/tasks/main.yml"
    dc_bootstrap_playbook: "{{ repo_root }}/playbooks/dc-bootstrap.yml"
    dc_restore_playbook: "{{ repo_root }}/playbooks/dc-restore.yml"
    dc_converge_playbook: "{{ repo_root }}/playbooks/dc-converge.yml"
    converge_tasks: "{{ repo_root }}/roles/samba_dc/tasks/converge.yml"
    restore_tasks: "{{ repo_root }}/roles/samba_dc/tasks/restore.yml"
  tasks:
    - name: Samba DC | bootstrap tasks exist
      ansible.builtin.stat:
        path: "{{ bootstrap_tasks }}"
      register: bootstrap_stat

    - name: Samba DC | assert bootstrap tasks present
      ansible.builtin.assert:
        that:
          - bootstrap_stat.stat.exists

    - name: Samba DC | assert main.yml does not auto-include bootstrap or converge
      ansible.builtin.shell: |
        ! grep -qE '(include_tasks|import_tasks).*bootstrap|(include_tasks|import_tasks).*converge|tasks_from: (bootstrap|converge)' "{{ main_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert bootstrap has sam.ldb creates guard
      ansible.builtin.shell: |
        grep -q 'creates: /var/lib/samba/private/sam.ldb' "{{ bootstrap_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert bootstrap does not template smb.conf
      ansible.builtin.shell: |
        ! grep -qE 'template:.*smb\.conf|src:.*smb\.conf' "{{ bootstrap_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert dc-bootstrap.yml imports bootstrap tasks
      ansible.builtin.shell: |
        grep -q 'tasks_from: bootstrap' "{{ dc_bootstrap_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert dc-converge.yml imports converge tasks
      ansible.builtin.shell: |
        grep -q 'tasks_from: converge' "{{ dc_converge_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert converge.yml imports operator_ssh tasks
      ansible.builtin.shell: |
        grep -q 'import_tasks: operator_ssh.yml' "{{ converge_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert dc-bootstrap refuses production without opt-in
      ansible.builtin.shell: |
        grep -q 'allow_production' "{{ dc_bootstrap_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | restore tasks exist
      ansible.builtin.stat:
        path: "{{ restore_tasks }}"
      register: restore_stat

    - name: Samba DC | assert restore tasks present
      ansible.builtin.assert:
        that:
          - restore_stat.stat.exists

    - name: Samba DC | assert dc-restore.yml imports restore tasks
      ansible.builtin.shell: |
        grep -q 'tasks_from: restore' "{{ dc_restore_playbook }}"
        grep -q 'allow_production' "{{ dc_restore_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert dc-restore configures upstream DNS before baseline
      ansible.builtin.shell: |
        grep -q 'tasks_from: dns_upstream_resolver' "{{ dc_restore_playbook }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert systemd-resolved masked only when BIND starts
      ansible.builtin.shell: |
        ! grep -q 'systemd-resolved' "{{ restore_tasks }}"
        ! grep -q 'systemd-resolved' "{{ bootstrap_tasks }}"
        grep -q 'systemd-resolved' "{{ repo_root }}/roles/samba_dc/tasks/dns_bind_dlz.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert bootstrap blocks migration hosts
      ansible.builtin.shell: |
        grep -q 'samba_dc_migration_host' "{{ bootstrap_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | samba_interfaces tasks exist
      ansible.builtin.stat:
        path: "{{ repo_root }}/roles/samba_dc/tasks/samba_interfaces.yml"
      register: samba_interfaces_stat

    - name: Samba DC | assert samba_interfaces tasks present
      ansible.builtin.assert:
        that:
          - samba_interfaces_stat.stat.exists

    - name: Samba DC | assert dns_bind_dlz deploys managed smb.conf
      ansible.builtin.shell: |
        grep -q 'import_tasks: smb_conf_deploy.yml' "{{ repo_root }}/roles/samba_dc/tasks/dns_bind_dlz.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert converge deploys managed smb.conf then prunes DNS
      ansible.builtin.shell: |
        grep -q 'import_tasks: smb_conf_deploy.yml' "{{ converge_tasks }}"
        grep -q 'import_tasks: samba_interfaces.yml' "{{ converge_tasks }}"
        test "$(grep -n 'smb_conf_deploy.yml' "{{ converge_tasks }}" | head -1 | cut -d: -f1)" \
          -lt "$(grep -n 'samba_interfaces.yml' "{{ converge_tasks }}" | head -1 | cut -d: -f1)"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert smb.conf template and backup deploy task exist
      ansible.builtin.shell: |
        test -f "{{ repo_root }}/roles/samba_dc/templates/smb.conf.j2"
        grep -q 'samba_dc_smb_conf_backup_dir' "{{ repo_root }}/roles/samba_dc/defaults/main.yml"
        grep -q 'testparm' "{{ repo_root }}/roles/samba_dc/tasks/smb_conf_deploy.yml"
        grep -q 'server services = -smb +s3fs -dns' "{{ repo_root }}/roles/samba_dc/templates/smb.conf.j2"
        ! grep -q 'blockinfile' "{{ repo_root }}/roles/samba_dc/tasks/samba_interfaces.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert bootstrap passes interface options to provision
      ansible.builtin.shell: |
        grep -q 'samba_interfaces_resolve.yml' "{{ bootstrap_tasks }}"
        grep -q 'bind interfaces only=yes' "{{ bootstrap_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert converge deploys named.conf.options
      ansible.builtin.shell: |
        grep -q 'import_tasks: dns_bind_options.yml' "{{ converge_tasks }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert named.conf.options includes IPv6 and localnets
      ansible.builtin.shell: |
        grep -q 'listen-on-v6' "{{ repo_root }}/roles/samba_dc/templates/named.conf.options.j2"
        grep -q 'localnets' "{{ repo_root }}/roles/samba_dc/templates/named.conf.options.j2"
        grep -q 'samba_dc_dns_include_localnets' "{{ repo_root }}/roles/samba_dc/defaults/main.yml"
        grep -q 'dc_trusted_networks' "{{ repo_root }}/roles/samba_dc/defaults/main.yml"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Samba DC | assert production dc example documents dc_trusted_networks
      ansible.builtin.shell: |
        grep -q 'dc_trusted_networks' "{{ repo_root }}/inventories/production/group_vars/dc/vars.yml.example"
        grep -q '192.168.3.0/24' "{{ repo_root }}/inventories/production/group_vars/dc/vars.yml.example"
      args:
        executable: /bin/bash
      changed_when: false
