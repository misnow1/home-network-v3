---
# Post-converge checks for Slice 2 integration tests (dc01.lab.test).

- name: Integration — Samba AD DC convergence
  hosts: dc
  gather_facts: true
  vars:
    dc_admin_principal: Administrator@{{ lab_realm | upper }}
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert samba-ad-dc is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['samba-ad-dc.service'].state == 'running'
        fail_msg: samba-ad-dc is not running

    - name: Assert named is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['named.service'].state == 'running'
        fail_msg: named is not running

    - name: Assert Samba AD domain info responds
      ansible.builtin.command: samba-tool domain info 127.0.0.1
      register: domain_info
      changed_when: false
      failed_when: domain_info.rc != 0

    - name: Assert LDAP root DSE is reachable
      ansible.builtin.command: ldapsearch -H ldap://127.0.0.1 -x -b "" -s base namingContexts
      register: ldap_root
      changed_when: false
      failed_when: ldap_root.rc != 0

    - name: Query _ldap._tcp SRV record from BIND on DC
      ansible.builtin.command: dig +short @127.0.0.1 _ldap._tcp.{{ lab_domain }} SRV
      register: ldap_srv
      changed_when: false
      failed_when: ldap_srv.stdout | length == 0

    - name: Obtain Kerberos ticket for domain Administrator
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s\n' "${KRB5_PASSWORD}" | kinit "${KRB5_PRINCIPAL}"
        klist
      args:
        executable: /bin/bash
      environment:
        KRB5_PASSWORD: "{{ vault_samba_admin_password }}"
        KRB5_PRINCIPAL: "{{ dc_admin_principal }}"
      register: kinit_result
      changed_when: false
      no_log: true
      failed_when: kinit_result.rc != 0

    - name: Query DC hostname A records from BIND on DC
      ansible.builtin.command: dig +short @127.0.0.1 {{ inventory_hostname }} A
      register: dc_hostname_a
      changed_when: false

    - name: Assert DC hostname A record includes expected LAN IP
      ansible.builtin.assert:
        that:
          - (vm_ip | default(ansible_host)) in dc_hostname_a.stdout_lines
        fail_msg: >-
          Expected {{ vm_ip | default(ansible_host) }} in A records for
          {{ inventory_hostname }}; got {{ dc_hostname_a.stdout_lines }}

    - name: Assert DC hostname A records exclude Docker bridge range
      ansible.builtin.assert:
        that:
          - dc_hostname_a.stdout_lines | select('match', '^172\.(1[6-9]|2[0-9]|3[01])\.') | list | length == 0
        fail_msg: >-
          DC A records must not include Docker bridge addresses (172.16.0.0/12);
          got {{ dc_hostname_a.stdout_lines }}

    - name: Assert smb.conf binds Samba to primary interface only
      ansible.builtin.shell: |
        set -euo pipefail
        smb_conf="$(readlink -f /etc/samba/smb.conf 2>/dev/null || echo /etc/samba/smb.conf)"
        grep -qE '^\s*bind interfaces only\s*=\s*yes' "$smb_conf"
        grep -qF "{{ ansible_facts['default_ipv4']['interface'] }}" "$smb_conf"
      args:
        executable: /bin/bash
      changed_when: false
