---
# Post-converge checks for security-updates integration tests.

- name: Integration — security updates convergence
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert unattended-upgrades package is installed
      ansible.builtin.command: dpkg -s unattended-upgrades
      register: unattended_pkg
      changed_when: false
      failed_when: unattended_pkg.rc != 0

    - name: Assert periodic apt upgrades are enabled
      ansible.builtin.shell: |
        grep -q 'APT::Periodic::Unattended-Upgrade "1"' /etc/apt/apt.conf.d/20auto-upgrades
      args:
        executable: /bin/bash
      changed_when: false

    - name: Assert security origins are configured
      ansible.builtin.shell: |
        grep -q '${distro_codename}-security' /etc/apt/apt.conf.d/50unattended-upgrades
      args:
        executable: /bin/bash
      changed_when: false

    - name: Assert automatic reboot policy matches inventory
      ansible.builtin.shell: |
        set -euo pipefail
        expected="{{ 'true' if unattended_upgrades_auto_reboot | bool else 'false' }}"
        grep -q "Unattended-Upgrade::Automatic-Reboot \"${expected}\"" /etc/apt/apt.conf.d/50unattended-upgrades
      args:
        executable: /bin/bash
      changed_when: false

    - name: Assert reboot time is set when automatic reboot is enabled
      ansible.builtin.shell: |
        grep -q 'Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_upgrades_reboot_time }}"' \
          /etc/apt/apt.conf.d/50unattended-upgrades
      args:
        executable: /bin/bash
      changed_when: false
      when: unattended_upgrades_auto_reboot | bool

    - name: Check needrestart override file
      ansible.builtin.stat:
        path: /etc/needrestart/conf.d/90-ansible.conf
      register: needrestart_override
      when: unattended_upgrades_needrestart_manage | default(false) | bool

    - name: Assert needrestart override presence matches inventory
      ansible.builtin.assert:
        that:
          - needrestart_override.stat.exists == (unattended_upgrades_needrestart_skip_systemd_manager | default(false) | bool)
        fail_msg: >-
          /etc/needrestart/conf.d/90-ansible.conf presence
          ({{ needrestart_override.stat.exists }}) does not match
          unattended_upgrades_needrestart_skip_systemd_manager
      when: unattended_upgrades_needrestart_manage | default(false) | bool

    - name: Assert needrestart drops the systemd-manager restart and parses cleanly
      ansible.builtin.shell: |
        set -euo pipefail
        grep -q 'blacklist_rc' /etc/needrestart/conf.d/90-ansible.conf
        grep -q 'systemd-manager' /etc/needrestart/conf.d/90-ansible.conf
        perl -c /etc/needrestart/conf.d/90-ansible.conf
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - unattended_upgrades_needrestart_manage | default(false) | bool
        - unattended_upgrades_needrestart_skip_systemd_manager | default(false) | bool

    - name: Assert mail notifications are configured
      ansible.builtin.shell: |
        set -euo pipefail
        grep -q 'Unattended-Upgrade::Mail "{{ unattended_upgrades_mail }}"' \
          /etc/apt/apt.conf.d/50unattended-upgrades
        grep -q 'Unattended-Upgrade::MailReport "{{ unattended_upgrades_mail_report }}"' \
          /etc/apt/apt.conf.d/50unattended-upgrades
      args:
        executable: /bin/bash
      changed_when: false
      when: unattended_upgrades_mail | length > 0
