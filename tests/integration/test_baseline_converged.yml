---
# Post-converge checks for Slice 1 integration tests.

- name: Integration — baseline convergence
  hosts: all
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../../roles/linux_baseline/defaults/main.yml"
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert FQDN matches inventory
      ansible.builtin.assert:
        that:
          - ansible_facts['fqdn'] == inventory_hostname
        fail_msg: "Expected FQDN {{ inventory_hostname }}, got {{ ansible_facts['fqdn'] }}"

    - name: Assert chrony is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['chrony.service'].state == 'running'
        fail_msg: chrony is not running

    - name: Read configured timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: baseline_timezone
      changed_when: false

    - name: Assert timezone matches baseline
      ansible.builtin.assert:
        that:
          - baseline_timezone.stdout == linux_baseline_timezone
        fail_msg: "Expected timezone {{ linux_baseline_timezone }}, got {{ baseline_timezone.stdout }}"

    - name: Assert openssh-server is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service'].state == 'running'
        fail_msg: ssh is not running

    - name: Assert baseline apt packages are installed
      ansible.builtin.command: dpkg -s {{ item }}
      register: baseline_pkg_check
      changed_when: false
      failed_when: baseline_pkg_check.rc != 0
      loop:
        - htop
        - zsh
        - jq

    - name: Assert fzf is on PATH
      ansible.builtin.command: fzf --version
      register: baseline_fzf_version
      changed_when: false
      failed_when: baseline_fzf_version.rc != 0

    - name: Assert fzf version matches pinned release
      ansible.builtin.assert:
        that:
          - linux_baseline_github_releases | selectattr('name', 'equalto', 'fzf') | map(attribute='version') | first in baseline_fzf_version.stdout
        fail_msg: "fzf version mismatch: {{ baseline_fzf_version.stdout }}"
