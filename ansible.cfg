[defaults]
inventory           = inventories/lab
roles_path          = roles
collections_path    = ~/.ansible/collections:/usr/share/ansible/collections
interpreter_python  = auto_silent
forks               = 10
remote_user         = ansible
host_key_checking   = False

# Lab and production use different vault passwords — do not set vault_password_file
# here (ansible-vault and ad-hoc commands would pick the wrong file). Lab scripts
# pass --vault-password-file .vault_pass_lab; production uses scripts/prod-run.sh
# and --vault-password-file .vault_pass. See docs/vault-schema.md.

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
