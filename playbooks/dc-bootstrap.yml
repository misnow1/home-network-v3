---
# Samba AD DC initial bootstrap — destructive on first run.
# See docs/dc-runbook.md. Lab integration: scripts/test-integration.sh (dc01.lab.test).
#
# Safety: refuses production inventory unless -e allow_production=true.

- name: Bootstrap Samba AD Domain Controller
  hosts: dc
  become: true
  pre_tasks:
    - name: DC bootstrap | refuse production inventory without opt-in
      ansible.builtin.assert:
        that:
          - >-
            inventory_dir is search('/lab')
            or (allow_production | default(false) | bool)
        fail_msg: >-
          Refusing dc-bootstrap against non-lab inventory.
          Pass -e allow_production=true for break-glass production use.
          See docs/dc-runbook.md.
      tags: [always]

    - name: DC bootstrap | assert host is in lab group or break-glass is set
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('lab', [])
            or (allow_production | default(false) | bool)
        fail_msg: >-
          {{ inventory_hostname }} is not in the lab inventory group.
          Pass -e allow_production=true only after reading docs/dc-runbook.md.
      tags: [always]

    - name: DC bootstrap | Configure upstream resolver for apt and retries
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: dns_upstream_resolver
      tags: [samba_dns, baseline]

  roles:
    - role: linux_baseline
      tags: [baseline]

  tasks:
    - name: Bootstrap samba_dc
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: bootstrap
      tags: [samba_bootstrap]
