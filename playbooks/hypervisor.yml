---
# Converge libvirt/KVM and Docker on hypervisor-class hosts.
# Lab integration: scripts/test-integration.sh (hv01.lab.test, nested virt).
#
# Run baseline.yml first. Uses serial: 1 for libvirt safety on shared hosts.

- name: Configure hypervisor hosts
  hosts: hypervisors
  become: true
  serial: 1
  roles:
    - role: host_firewall
      when: host_firewall_enabled | default(false) | bool
      tags: [host_firewall]
    - role: hypervisor
