---
# Samba AD DC restore — offline fallback from samba-tool domain backup.
# Use when no live peer DC is available. Preferred path: dc-replica-join.yml.
# See docs/dc-runbook.md.
#
# Safety: refuses production inventory unless -e allow_production=true.
#
# Example:
#   ./scripts/prod-run.sh --confirm-production -- \
#     playbooks/dc-restore.yml -e allow_production=true \
#     -e samba_dc_backup_archive=backups/home-ad-backup.tar.bz2 \
#     --limit dc1.home.2123studios.com

- name: Restore Samba AD Domain Controller from backup
  hosts: dc
  become: true
  pre_tasks:
    - name: DC restore | refuse production inventory without opt-in
      ansible.builtin.assert:
        that:
          - >-
            inventory_dir is search('/lab')
            or (allow_production | default(false) | bool)
        fail_msg: >-
          Refusing dc-restore against non-lab inventory.
          Pass -e allow_production=true for break-glass production use.
          See docs/dc-runbook.md.
      tags: [always]

    - name: DC restore | assert host is in lab group or break-glass is set
      ansible.builtin.assert:
        that:
          - inventory_hostname in groups.get('lab', [])
            or (allow_production | default(false) | bool)
        fail_msg: >-
          {{ inventory_hostname }} is not in the lab inventory group.
          Pass -e allow_production=true only after reading docs/dc-runbook.md.
      tags: [always]

    - name: DC restore | Configure upstream resolver for apt and retries
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: dns_upstream_resolver
      tags: [samba_dns, baseline]

  roles:
    - role: linux_baseline
      tags: [baseline]

  tasks:
    - name: Restore samba_dc from backup
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: restore
      tags: [samba_restore]

    - name: Configure BIND DLZ and start directory services
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: dns_bind_dlz
      tags: [samba_dns, samba_restore]
