---
# Converge Samba AD member file servers (winbind + idmap_ad).
# Run baseline.yml first. Lab integration: scripts/test-integration.sh (nas01.lab.test + dc01).

- name: Configure Samba file servers
  hosts: fileservers
  become: true
  roles:
    - role: samba_fileserver
    - role: hypervisor
      when: hypervisor_libvirt_enabled | default(false) | bool
      tags: [libvirt, hypervisor_netplan, hypervisor_networks, docker]
