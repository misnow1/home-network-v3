---
# Issue TLS certificates on domain controllers and wire Samba LDAPS/START-TLS.
# Requires dc-converge.yml first (smb.conf must exist).
#
# Safety: refuses production inventory unless -e allow_production=true.

- name: Converge Certbot TLS on domain controllers
  hosts: dc
  become: true
  pre_tasks:
    - name: Certbot | refuse production inventory without opt-in
      ansible.builtin.assert:
        that:
          - >-
            inventory_dir is search('/lab')
            or (allow_production | default(false) | bool)
        fail_msg: >-
          Refusing certbot against non-lab inventory without allow_production=true.
          See docs/certbot-runbook.md.
      tags: [always]

    - name: Certbot | Require TLS flags in group_vars
      ansible.builtin.assert:
        that:
          - certbot_enabled | default(false) | bool
          - samba_dc_tls_enabled | default(false) | bool
        fail_msg: >-
          Enable certbot_enabled and samba_dc_tls_enabled in group_vars/dc/vars.yml
          before running playbooks/certbot.yml. See docs/certbot-runbook.md and
          inventories/production/group_vars/dc/vars.yml.example.
      tags: [always]

  roles:
    - role: certbot
      tags: [certbot]
      when: certbot_enabled | default(false) | bool

  tasks:
    - name: Certbot | Apply Samba LDAP TLS configuration
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: tls
      when: samba_dc_tls_enabled | default(false) | bool
      tags: [samba_tls]
