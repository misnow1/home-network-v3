---
# Issue TLS certificates on certbot-managed hosts and apply service-specific TLS hooks.
# DC hosts: Samba LDAPS/START-TLS (requires dc-converge.yml first).
# Mail relay hosts: Postfix START-TLS (reload via deploy hook after renewal).
#
# Safety: refuses production inventory unless -e allow_production=true.

- name: Converge Certbot TLS on certbot-managed hosts
  hosts: certbot
  become: true
  pre_tasks:
    - name: Certbot | refuse production inventory without opt-in
      ansible.builtin.assert:
        that:
          - >-
            inventory_dir is search('/lab')
            or (allow_production | default(false) | bool)
        fail_msg: >-
          Refusing certbot against non-lab inventory without allow_production=true.
          See docs/certbot-runbook.md.
      tags: [always]

    - name: Certbot | Require certbot_enabled in group_vars
      ansible.builtin.assert:
        that:
          - certbot_enabled | default(false) | bool
        fail_msg: >-
          Enable certbot_enabled in host or group_vars before running
          playbooks/certbot.yml. See docs/certbot-runbook.md.
      tags: [always]

    - name: Certbot | Require Samba TLS flags on DC hosts
      ansible.builtin.assert:
        that:
          - samba_dc_tls_enabled | default(false) | bool
        fail_msg: >-
          Enable samba_dc_tls_enabled in group_vars/dc/vars.yml for DC certbot runs.
          See docs/certbot-runbook.md.
      when: "'dc' in group_names"
      tags: [always]

  roles:
    - role: certbot
      tags: [certbot]
      when: certbot_enabled | default(false) | bool

  tasks:
    - name: Certbot | Apply Samba LDAP TLS configuration
      ansible.builtin.include_role:
        name: samba_dc
        tasks_from: tls
      when:
        - "'dc' in group_names"
        - samba_dc_tls_enabled | default(false) | bool
      tags: [samba_tls]
