---
# Samba AD DC ongoing convergence — idempotent; safe to re-run.
# Requires dc-bootstrap.yml to have completed first.
#
# Safety: refuses production inventory unless -e allow_production=true.

- name: Converge Samba AD Domain Controller
  hosts: dc
  become: true
  pre_tasks:
    - name: DC converge | refuse production inventory without opt-in
      ansible.builtin.assert:
        that:
          - >-
            inventory_dir is search('/lab')
            or (allow_production | default(false) | bool)
        fail_msg: >-
          Refusing dc-converge against non-lab inventory without allow_production=true.
          See docs/dc-runbook.md.
      tags: [always]

  tasks:
    - name: Converge samba_dc
      ansible.builtin.import_role:
        name: samba_dc
        tasks_from: converge
      tags: [samba_converge]

    - name: Converge LDAP VIP (keepalived)
      ansible.builtin.import_role:
        name: keepalived_ldap
      tags: [ldap_vip, samba_converge]
