---
# Lab inventory for integration tests and development.
# Domain: lab.test | Network: home-dc-lab (192.168.100.0/24)
#
# Hosts are created on demand by scripts/lab/vm-create.sh and torn down by
# scripts/lab/vm-destroy.sh. IP addresses may be static (cloud-init) or DHCP.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    lab_domain: lab.test
    lab_realm: LAB.TEST
    lab_network: home-dc-lab
    lab_subnet: 192.168.100.0/24

  children:
    lab:
      hosts:
        member01.lab.test:
          ansible_host: 192.168.100.11
          vm_name: member01-lab-test
          vm_ip: 192.168.100.11
          lab_slice: ddns
        dc01.lab.test:
          ansible_host: 192.168.100.10
          vm_name: dc01-lab-test
          vm_ip: 192.168.100.10
          vm_memory_mb: 4096
          vm_disk_gb: 24
          lab_slice: dc
        dc02.lab.test:
          ansible_host: 192.168.100.12
          vm_name: dc02-lab-test
          vm_ip: 192.168.100.12
          vm_memory_mb: 4096
          vm_disk_gb: 24
          lab_slice: dc_replica
        hv01.lab.test:
          ansible_host: 192.168.100.21
          vm_name: hv01-lab-test
          vm_ip: 192.168.100.21
          vm_memory_mb: 6144
          vm_disk_gb: 32
          lab_slice: backup
          vm_nested_virt: true
        nas01.lab.test:
          ansible_host: 192.168.100.31
          vm_name: nas01-lab-test
          vm_ip: 192.168.100.31
          lab_slice: fileserver

    bastion:
      hosts:
        member01.lab.test:

    reverse_proxy:
      hosts:
        member01.lab.test:

    linux:
      children:
        lab:
        bastion:

    dc:
      hosts:
        dc01.lab.test:
        dc02.lab.test:

    certbot:
      children:
        dc:

    hypervisors:
      hosts:
        hv01.lab.test:

    fileservers:
      hosts:
        nas01.lab.test:

    ddns_clients:
      hosts:
        member01.lab.test:
