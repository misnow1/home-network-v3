---
# Lab inventory for integration tests and development.
# Domain: lab.test | Network: home-dc-lab (192.168.100.0/24)
#
# Hosts are created on demand by scripts/lab/vm-create.sh and torn down by
# scripts/lab/vm-destroy.sh. IP addresses may be static (cloud-init) or DHCP.

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    lab_domain: lab.test
    lab_realm: LAB.TEST
    lab_network: home-dc-lab
    lab_subnet: 192.168.100.0/24

  children:
    lab:
      hosts:
        member01.lab.test:
          lab_vm_name: member01-lab-test
          lab_vm_ip: 192.168.100.11
          lab_slice: baseline
        dc01.lab.test:
          lab_vm_name: dc01-lab-test
          lab_vm_ip: 192.168.100.10
          lab_slice: dc
        hv01.lab.test:
          lab_vm_name: hv01-lab-test
          lab_vm_ip: 192.168.100.21
          lab_slice: hypervisor
          lab_nested_virt: true
        nas01.lab.test:
          lab_vm_name: nas01-lab-test
          lab_vm_ip: 192.168.100.31
          lab_slice: fileserver

    linux:
      children:
        lab:
