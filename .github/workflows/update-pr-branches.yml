---
# When main moves, merge main into open (non-draft) PR branches.
# This uses GitHub's update-branch API (merge), not a force-push rebase.
name: Update PR Branches

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update open PR branches with main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            for (const pr of prs) {
              if (pr.draft) {
                core.info(`Skip #${pr.number} (draft)`);
                continue;
              }
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                core.info(`Updated #${pr.number} (${pr.head.ref})`);
              } catch (error) {
                const msg = error.message || String(error);
                // 422 = already up to date, conflicts, or not mergeable
                core.warning(`Skip #${pr.number}: ${msg}`);
              }
            }
