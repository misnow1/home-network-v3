---
# GitHub Actions — tier 1+2 (linters and structural tests).
# Tier 3 integration tests run manually on kvm01 via scripts/test-integration.sh.

name: Test Quick

'on':
  push:
  pull_request:

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Galaxy collections
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ hashFiles('requirements.yml') }}

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install VM tooling for dry-run smoke test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils genisoimage

      - name: Write lab vault password
        env:
          VAULT_PASS_LAB: ${{ secrets.VAULT_PASS_LAB }}
        run: |
          if [ -z "${VAULT_PASS_LAB}" ]; then
            echo "::error::VAULT_PASS_LAB is empty. Set it under Actions secrets and Dependabot secrets (same value as .vault_pass_lab)."
            exit 1
          fi
          printf '%s' "${VAULT_PASS_LAB}" > .vault_pass_lab

      - name: Run quick tests
        run: ./scripts/test-quick.sh
        env:
          VAULT_PASS_LAB: ${{ secrets.VAULT_PASS_LAB }}
