---
# Internal SMTP relay for outbound server mail. Run on kif (host networking).
#
# Prerequisites on host:
#   - Let's Encrypt certs at /etc/letsencrypt/live/${MAIL_RELAY_HOSTNAME}/
#   - Copy .env.example to .env and set Gmail + recipient vars
#
# Deploy: docker compose up -d --build

services:
  mail-relay:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./postfix:/etc/postfix/templates:ro
    restart: unless-stopped
